version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    ignore:
      # Proton VPN 5.1.5 installs the strongly named log4net 3.2.0 assembly.
      # Suppress only the currently incompatible 3.3.x line. A future 3.4+
      # release should surface as a fresh compatibility-review signal.
      - dependency-name: "log4net"
        versions:
          - "3.3.*"
    open-pull-requests-limit: 100
