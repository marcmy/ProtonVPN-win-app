version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    ignore:
      # Proton VPN 5.1.5 installs the strongly named log4net 3.2.0 assembly.
      # Fast-patch output must remain compatible with that installed runtime.
      - dependency-name: "log4net"
        versions:
          - "[3.3.0,)"
    open-pull-requests-limit: 3
