version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    # Avoid repeated graph-wide rebases after every merge. Update PR branches
    # explicitly when needed; all dependencies remain eligible for new updates.
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "Microsoft.Windows.Compatibility"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Collections.Immutable"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.ComponentModel.Composition"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Diagnostics.DiagnosticSource"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Diagnostics.EventLog"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
