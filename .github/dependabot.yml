version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    # Avoid repeated graph-wide rebases after every merge. Update PR branches
    # explicitly when needed; all dependencies remain eligible for new updates.
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    ignore:
      # Stay on the Windows App SDK major that upstream uses; still take its servicing releases.
      - dependency-name: "Microsoft.WindowsAppSDK"
        update-types: ["version-update:semver-major"]
    groups:
      # Vanara packages share Vanara.Core and must move to the same version together.
      vanara:
        patterns:
          - "Vanara.*"
