version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    ignore:
      # Proton VPN 5.1.5 installs the strongly named log4net 3.2.0 assembly.
      # Ignore all updates until the fast-patch output can target a newer installed runtime.
      - dependency-name: "log4net"
    open-pull-requests-limit: 3
