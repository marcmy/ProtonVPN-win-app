name: Fix FastPatch SFX loader command collision

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Rename loader helpers to collision-proof commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/New-ProtonVPNPatchSfx.ps1'
          $content = Get-Content -LiteralPath $path -Raw

          $replacements = @(
              @('function D([string] $Value)', 'function Decode-FastPatchValue([string] $Value)'),
              @('function H([byte[]] $Bytes)', 'function Get-FastPatchBytesSha256([byte[]] $Bytes)'),
              @('function IsAdmin {', 'function Test-FastPatchAdministrator {'),
              @('(D ''__INSTALLER__'')', '(Decode-FastPatchValue ''__INSTALLER__'')'),
              @('(D ''__PAYLOAD__'')', '(Decode-FastPatchValue ''__PAYLOAD__'')'),
              @('$actualInstallerHash = H $bytes', '$actualInstallerHash = Get-FastPatchBytesSha256 $bytes'),
              @('(IsAdmin)', '(Test-FastPatchAdministrator)'),
              @('(D ''__TARGET__'')', '(Decode-FastPatchValue ''__TARGET__'')')
          )

          foreach ($pair in $replacements) {
              $old = [string] $pair[0]
              $new = [string] $pair[1]
              if (-not $content.Contains($old)) {
                  throw "Expected loader fragment was not found: $old"
              }
              $content = $content.Replace($old, $new)
          }

          [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))

      - name: Remove one-time workflow and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-sfx-loader-command-collision.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/New-ProtonVPNPatchSfx.ps1
          git commit -m 'Fix FastPatch SFX loader command collision'
          git push origin HEAD:security/fastpatch-immutable-staging
