name: Temporary apply feedback async cleanup

on:
  push:
    branches:
      - agent/feedback-autodismiss-async-cleanup
    paths:
      - .github/workflows/temp-apply-feedback-async-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/feedback-autodismiss-async-cleanup
          persist-credentials: true

      - name: Apply certificate receiver cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/Client/Logic/Connection/ProtonVPN.Client.Logic.Connection/ConnectionManager.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '''    public async void Receive(ConnectionCertificateUpdatedMessage message)\n    {\n        AsymmetricKeyPair? clientKeyPair = _connectionKeyManager.GetKeyPairOrNull();\n\n        if (message.Certificate is not null && clientKeyPair is not null)\n        {\n            await _vpnServiceCaller.UpdateLocalAgentTlsCredentialsAsync(new LocalAgentTlsCredentialsIpcEntity()\n            {\n                ConnectionCertificate = new ConnectionCertificateIpcEntity()\n                {\n                    Pem = message.Certificate.Value.Pem,\n                    ExpirationDateUtc = message.Certificate.Value.ExpirationUtcDate.UtcDateTime,\n                },\n                ClientKeyPair = _entityMapper.Map<AsymmetricKeyPair, AsymmetricKeyPairIpcEntity>(clientKeyPair),\n            });\n        }\n    }'''
          new = '''    public void Receive(ConnectionCertificateUpdatedMessage message)\n    {\n        AsymmetricKeyPair? clientKeyPair = _connectionKeyManager.GetKeyPairOrNull();\n\n        if (message.Certificate is not null && clientKeyPair is not null)\n        {\n            _vpnServiceCaller.UpdateLocalAgentTlsCredentialsAsync(new LocalAgentTlsCredentialsIpcEntity()\n            {\n                ConnectionCertificate = new ConnectionCertificateIpcEntity()\n                {\n                    Pem = message.Certificate.Value.Pem,\n                    ExpirationDateUtc = message.Certificate.Value.ExpirationUtcDate.UtcDateTime,\n                },\n                ClientKeyPair = _entityMapper.Map<AsymmetricKeyPair, AsymmetricKeyPairIpcEntity>(clientKeyPair),\n            }).FireAndForget();\n        }\n    }'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one certificate receiver block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/temp-apply-feedback-async-cleanup.yml')
          workflow.unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Avoid async void certificate update receiver"
          git push origin HEAD:agent/feedback-autodismiss-async-cleanup
