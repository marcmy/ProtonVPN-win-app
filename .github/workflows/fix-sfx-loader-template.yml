name: Fix FastPatch SFX loader template

on:
  push:
    branches:
      - security/fastpatch-immutable-staging
    paths:
      - .github/scripts/fix-sfx-loader-template.py
      - .github/workflows/fix-sfx-loader-template.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/fastpatch-immutable-staging
      - run: python .github/scripts/fix-sfx-loader-template.py
      - run: |
          rm .github/scripts/fix-sfx-loader-template.py
          rm .github/workflows/fix-sfx-loader-template.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix SFX verifier template syntax"
          git push origin HEAD:security/fastpatch-immutable-staging
