name: Fix FastPatch negative child capture

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Capture expected child failures without aborting regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/scripts/test-fast-patch-secure-staging.ps1'
          $content = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $pattern = '(?ms)^(?<indent>[ \t]*)\$output = @\(& powershell\.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand \$encoded 2>&1\)\n\k<indent>\$exitCode = \$LASTEXITCODE\n\k<indent>return \[pscustomobject\]@\{'
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
              throw 'Expected Invoke-BootstrapFixture child invocation block was not found.'
          }
          $indent = $match.Groups['indent'].Value
          $replacementLines = @(
              $indent + '# Several tests intentionally make the bootstrap fail. Windows PowerShell writes an',
              $indent + '# unhandled child exception to stderr, which must be captured as test evidence rather',
              $indent + "# than promoted by this harness's ErrorActionPreference=Stop.",
              $indent + '$previousErrorActionPreference = $ErrorActionPreference',
              $indent + 'try {',
              $indent + "    `$ErrorActionPreference = 'Continue'",
              $indent + '    $output = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded 2>&1)',
              $indent + '    $exitCode = $LASTEXITCODE',
              $indent + '} finally {',
              $indent + '    $ErrorActionPreference = $previousErrorActionPreference',
              $indent + '}',
              $indent + 'return [pscustomobject]@{'
          )
          $replacement = $replacementLines -join "`n"
          $content = $content.Substring(0, $match.Index) + $replacement + $content.Substring($match.Index + $match.Length)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))

      - name: Remove one-time workflow and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-negative-child-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/test-fast-patch-secure-staging.ps1
          git commit -m 'Capture expected FastPatch bootstrap failures'
          git push origin HEAD:security/fastpatch-immutable-staging
