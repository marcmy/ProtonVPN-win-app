name: Diagnose IExpress command anchor

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Test inline command, SystemRoot path, and bare-name hijack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('iexpress-anchor-'+[Guid]::NewGuid().ToString('N'));$src=Join-Path $root 'src';New-Item -ItemType Directory -Force $src|Out-Null
          $iexpress=Join-Path $env:SystemRoot 'System32\iexpress.exe'
          [IO.File]::WriteAllText((Join-Path $src 'probe.ps1'),'[IO.File]::WriteAllText($env:PROTONVPN_FASTPATCH_ANCHOR_PROBE,''ok'');exit 0',[Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $src 'dummy.txt'),'x',[Text.UTF8Encoding]::new($false))

          function Run([string]$Name,[string]$Command,[bool]$IncludeFake=$false){
            $out=Join-Path $root ($Name+'.exe');$sed=Join-Path $root ($Name+'.sed');$s=$src.TrimEnd('\')+'\'
            if($IncludeFake){Copy-Item (Join-Path $env:SystemRoot 'System32\cmd.exe') (Join-Path $src 'powershell.exe') -Force;$files="%FILE0%=`r`n%FILE1%=`r`n%FILE2%=";$strings="FILE0=`"dummy.txt`"`r`nFILE1=`"probe.ps1`"`r`nFILE2=`"powershell.exe`""}else{$files="%FILE0%=`r`n%FILE1%=";$strings="FILE0=`"dummy.txt`"`r`nFILE1=`"probe.ps1`"";Remove-Item (Join-Path $src 'powershell.exe') -Force -ErrorAction SilentlyContinue}
            $text=@"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=0
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName="$out"
          FriendlyName=$Name
          AppLaunched=$Command
          PostInstallCmd=<None>
          AdminQuietInstCmd=$Command
          UserQuietInstCmd=$Command
          SourceFiles=SourceFiles
          [SourceFiles]
          SourceFiles0="$s"
          [SourceFiles0]
          $files
          [Strings]
          $strings
          "@
            [IO.File]::WriteAllText($sed,$text,[Text.Encoding]::ASCII);&$iexpress /N /Q $sed;$dl=[DateTime]::UtcNow.AddSeconds(15);while([DateTime]::UtcNow-lt$dl-and-not(Test-Path $out)){Start-Sleep -Milliseconds 100};if(-not(Test-Path $out)){throw "build $Name"}
            $probe=Join-Path $root ($Name+'.probe');$env:PROTONVPN_FASTPATCH_ANCHOR_PROBE=$probe;$p=Start-Process $out -PassThru;$ex=$p.WaitForExit(6000);$hit=Test-Path $probe;$code=if($ex){$p.ExitCode}else{$null};if(-not$ex){Stop-Process $p.Id -Force -ErrorAction SilentlyContinue};Write-Host("IEXPRESS_ANCHOR name={0} exited={1} code={2} probe={3} len={4}"-f$Name,$ex,$code,$hit,$Command.Length);[pscustomobject]@{Name=$Name;Exited=$ex;Probe=$hit;Code=$code;Length=$Command.Length}
          }

          $literal='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
          $envps='%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
          $inline='[IO.File]::WriteAllText($env:PROTONVPN_FASTPATCH_ANCHOR_PROBE,''ok'');exit 0'
          $r=@()
          $r+=Run 'LiteralInlineCommand' ($literal+' -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '+$inline)
          $r+=Run 'EnvSystemRootFile' ($envps+' -NoProfile -NonInteractive -ExecutionPolicy Bypass -File probe.ps1')
          $r+=Run 'EnvSystemRootInline' ($envps+' -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '+$inline)
          $r+=Run 'BarePowerShellWithFake' 'powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File probe.ps1' $true
          $r|Format-Table -AutoSize|Out-String|Write-Host

      - name: Remove command-anchor diagnostic workflow
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';git rm --force .github/workflows/diagnose-iexpress-command-anchor.yml;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git commit -m 'Remove IExpress command-anchor diagnostic';git push origin HEAD:security/fastpatch-immutable-staging
