name: Run FastPatch memory transform

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  transform:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Transform production and SFX regression adapter
        shell: python
        run: python .github/scripts/_temp_fastpatch_memory_transform.py
      - name: Parse production scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/New-ProtonVPNPatchSfx.ps1','scripts/Install-ProtonVPNPatch.ps1','scripts/Install-ProtonVPNCompletePatch.ps1')) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$path : $($errors[0].Message)" }
          }
      - name: Commit transformed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/scripts/_temp_fastpatch_memory_transform.py
          git rm --force .github/workflows/run-fastpatch-memory-transform.yml
          git rm --force .github/workflows/fix-fastpatch-sfx-memory-archive.yml -ErrorAction SilentlyContinue
          git rm --force .github/workflows/fix-fastpatch-compiled-loader-launch.yml -ErrorAction SilentlyContinue
          git rm --force .github/workflows/apply-fastpatch-encoded-loader.yml -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/New-ProtonVPNPatchSfx.ps1 scripts/Install-ProtonVPNPatch.ps1 scripts/Install-ProtonVPNCompletePatch.ps1 .github/workflows/adapt-fastpatch-compiled-sfx-tests.yml
          git commit -m 'Consume SFX archive from verified process memory'
          git push origin HEAD:security/fastpatch-immutable-staging
