name: Fix FastPatch formatting final

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run final FastPatch formatting cleanup'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Normalize regression assertion formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_block(path, start_text, end_text, replacement):
              p = Path(path)
              lines = p.read_text(encoding='utf-8').replace('\r\n', '\n').splitlines()
              starts = [i for i, line in enumerate(lines) if line.strip() == start_text]
              if len(starts) != 1:
                  raise SystemExit(f'{path}: expected one start marker {start_text!r}; found {starts}')
              start = starts[0]
              ends = [i for i in range(start, len(lines)) if lines[i].strip() == end_text]
              if len(ends) != 1:
                  raise SystemExit(f'{path}: expected one end marker {end_text!r} after line {start}; found {ends}')
              end = ends[0]
              lines[start:end + 1] = replacement.split('\n')
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          replace_block(
              '.github/scripts/test-patch-tooling.ps1',
              'Assert-Condition ($mirrorInvocations.Count -eq 3) `',
              "'Installer must retain exactly one archival backup from the protected rollback snapshot.'",
              '''    Assert-Condition ($mirrorInvocations.Count -eq 3) `
                  'Installer must have one protected snapshot, one archival backup copy, and one protected rollback mirror.'
              $serviceDataPreservingMirrors = @(
                  $mirrorInvocations | Where-Object {
                      $_.Extent.Text.Contains("-ExcludedDirectories @('ServiceData')")
                  }
              )
              Assert-Condition ($serviceDataPreservingMirrors.Count -eq 2) `
                  'Protected rollback snapshot and restore must both preserve runtime ServiceData.'
              $archiveMirrors = @(
                  $mirrorInvocations | Where-Object {
                      $_.Extent.Text.Contains('-Source $trustedRollbackDirectory') -and
                          $_.Extent.Text.Contains('-Destination $backupDirectory')
                  }
              )
              Assert-Condition ($archiveMirrors.Count -eq 1) `
                  'Installer must retain exactly one archival backup from the protected rollback snapshot.' ''')

          replace_block(
              '.github/scripts/test-complete-fast-patch.ps1',
              'Assert-Condition (',
              ") 'Complete FastPatch base-installer delegation must reuse the existing console through the trusted process helper.'",
              '''    Assert-Condition (
                  $content.Contains('return Invoke-ProcessAndWait') -and
                  $content.Contains('-FilePath (Get-WindowsPowerShellPath)') -and
                  $content.Contains('$startInfo.CreateNoWindow = $false')
              ) 'Complete FastPatch base-installer delegation must reuse the existing console through the trusted process helper.' ''')
          '@ | Set-Content -LiteralPath .github/_fix_fastpatch_formatting_final.py -Encoding UTF8
          python .github/_fix_fastpatch_formatting_final.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath .github/_fix_fastpatch_formatting_final.py -Force

      - name: Parse and test FastPatch tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.github/scripts/test-patch-tooling.ps1',
            '.github/scripts/test-complete-fast-patch.ps1',
            '.github/scripts/test-fast-patch-secure-staging.ps1',
            'scripts/Install-ProtonVPNPatch.ps1',
            'scripts/Install-ProtonVPNCompletePatch.ps1',
            'scripts/New-ProtonVPNPatchSfx.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$path : $($errors[0].Message)" }
          }
          .\.github\scripts\test-patch-tooling.ps1
          .\.github\scripts\test-complete-fast-patch.ps1

      - name: Commit tested formatting cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-test-formatting.yml
          git rm --force .github/.fastpatch-test-formatting-trigger
          git rm --force .github/workflows/fix-fastpatch-formatting-final.yml
          git rm --force .github/.fastpatch-formatting-final-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/test-patch-tooling.ps1 .github/scripts/test-complete-fast-patch.ps1
          git commit -m 'Normalize FastPatch regression formatting'
          git push origin HEAD:security/fastpatch-immutable-staging
