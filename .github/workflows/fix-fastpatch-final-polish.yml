name: Fix FastPatch final polish

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply FastPatch final polish'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Polish module-independent secure staging changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          installer_path = Path('scripts/Install-ProtonVPNPatch.ps1')
          installer = installer_path.read_text(encoding='utf-8').replace('\r\n', '\n')

          old_hash_helper = '''function Get-Sha256HexFromFile {
          param([Parameter(Mandatory = $true)] [string] $Path)

          $stream = [IO.File]::Open(
              $Path,
              [IO.FileMode]::Open,
              [IO.FileAccess]::Read,
              [IO.FileShare]::Read)
          try {
              $sha256 = [Security.Cryptography.SHA256]::Create()
              try {
                  return ([BitConverter]::ToString(
                      $sha256.ComputeHash($stream))).Replace('-', '').ToLowerInvariant()
              } finally {
                  $sha256.Dispose()
              }
          } finally {
              $stream.Dispose()
          }
          }
          '''
          new_hash_helper = '''function Get-Sha256HexFromFile {
              param([Parameter(Mandatory = $true)] [string] $Path)

              $stream = [IO.File]::Open(
                  $Path,
                  [IO.FileMode]::Open,
                  [IO.FileAccess]::Read,
                  [IO.FileShare]::Read)
              try {
                  $sha256 = [Security.Cryptography.SHA256]::Create()
                  try {
                      return ([BitConverter]::ToString(
                          $sha256.ComputeHash($stream))).Replace('-', '').ToLowerInvariant()
                  } finally {
                      $sha256.Dispose()
                  }
              } finally {
                  $stream.Dispose()
              }
          }
          '''
          if installer.count(old_hash_helper) != 1:
              raise SystemExit(f'expected one unindented file-hash helper; found {installer.count(old_hash_helper)}')
          installer = installer.replace(old_hash_helper, new_hash_helper, 1)

          old_acl = '''$acl = $item.GetAccessControl(
              [Security.AccessControl.AccessControlSections]::Access -bor
                  [Security.AccessControl.AccessControlSections]::Owner)
          '''
          new_acl = '''        $acl = $item.GetAccessControl(
              [Security.AccessControl.AccessControlSections]::Access -bor
                  [Security.AccessControl.AccessControlSections]::Owner)
          '''
          if installer.count(old_acl) != 1:
              raise SystemExit(f'expected one unindented ACL block; found {installer.count(old_acl)}')
          installer = installer.replace(old_acl, new_acl, 1)
          installer_path.write_text(installer, encoding='utf-8')

          secure_path = Path('.github/scripts/test-fast-patch-secure-staging.ps1')
          secure = secure_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          obsolete_module_setup = '''$windowsPowerShellModulePath = Join-Path $env:SystemRoot 'System32\\WindowsPowerShell\\v1.0\\Modules'
          if ((Test-Path -LiteralPath $windowsPowerShellModulePath -PathType Container) -and
              (($env:PSModulePath -split ';') -notcontains $windowsPowerShellModulePath)) {
              $env:PSModulePath = $windowsPowerShellModulePath + ';' + $env:PSModulePath
          }
          '''
          if secure.count(obsolete_module_setup) != 1:
              raise SystemExit(f'expected one temporary PSModulePath setup; found {secure.count(obsolete_module_setup)}')
          secure = secure.replace(obsolete_module_setup, '', 1)
          secure_path.write_text(secure, encoding='utf-8')
          '@ | Set-Content -LiteralPath .github/_fix_fastpatch_final_polish.py -Encoding UTF8
          python .github/_fix_fastpatch_final_polish.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath .github/_fix_fastpatch_final_polish.py -Force
      - name: Parse and test FastPatch tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/Install-ProtonVPNPatch.ps1',
            '.github/scripts/test-fast-patch-secure-staging.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$path : $($errors[0].Message)" }
          }
          .\.github\scripts\test-patch-tooling.ps1
          .\.github\scripts\test-complete-fast-patch.ps1
      - name: Commit tested final polish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-final-polish.yml
          git rm --force .github/.fastpatch-final-polish-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/Install-ProtonVPNPatch.ps1 .github/scripts/test-fast-patch-secure-staging.ps1
          git commit -m 'Polish FastPatch secure staging regression'
          git push origin HEAD:security/fastpatch-immutable-staging
