name: NuGet dependency submission

on:
  push:
    branches: [marc/proton-main]
    paths:
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - '**/global.json'
      - '.github/workflows/nuget-dependency-submission.yml'
      - '.github/scripts/restore-nuget-lockfiles.ps1'
      - '.github/scripts/submit-nuget-snapshot.py'
  pull_request:
    branches: [marc/proton-main]
    paths:
      - '**/*.csproj'
      - '**/*.props'
      - '.github/workflows/nuget-dependency-submission.yml'
      - '.github/scripts/restore-nuget-lockfiles.ps1'
      - '.github/scripts/submit-nuget-snapshot.py'
  workflow_dispatch:
  schedule:
    - cron: '13 9 * * 1'

permissions:
  contents: read

jobs:
  verify-nuget:
    name: Verify resolved NuGet graph
    runs-on: windows-latest
    timeout-minutes: 55
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Restore supported app NuGet graphs
        run: ./.github/scripts/restore-nuget-lockfiles.ps1
      - name: Validate NuGet graph is nonempty
        run: python .github/scripts/submit-nuget-snapshot.py
      - name: Upload resolved NuGet graph
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: resolved-nuget-graph-${{ github.run_id }}
          path: |
            artifacts/nuget-snapshot.json
            src/**/packages.lock.json
          if-no-files-found: error
          retention-days: 14

  submit-nuget:
    name: Publish validated nonempty NuGet graph
    needs: verify-nuget
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fetch verified snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resolved-nuget-graph-${{ github.run_id }}
          path: .
      - name: Refuse empty snapshot before GitHub API submission
        shell: bash
        run: |
          test "$(jq '.manifests | length' artifacts/nuget-snapshot.json)" -ge 3
          test "$(jq '[.manifests[].resolved | keys[]] | unique | length' artifacts/nuget-snapshot.json)" -ge 30
          jq -e '[.manifests[].resolved | keys[]] | any(startswith("pkg:nuget/log4net@"))' artifacts/nuget-snapshot.json
      - name: Submit populated snapshot to dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/dependency-graph/snapshots" \
            --input artifacts/nuget-snapshot.json \
            --jq '{id, result, message}'
