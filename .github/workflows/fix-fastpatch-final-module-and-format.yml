name: Fix FastPatch final module cleanup

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply FastPatch final module cleanup'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Remove remaining privileged module dependencies and format tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          complete_path = Path('scripts/Install-ProtonVPNCompletePatch.ps1')
          complete = complete_path.read_text(encoding='utf-8').replace('\r\n', '\n')

          helper_anchor = 'function Write-TrustedSnapshot {\n'
          file_hash_helper = '''function Get-Sha256HexFromFile {
              param([Parameter(Mandatory = $true)] [string] $Path)

              $stream = [IO.File]::Open(
                  $Path,
                  [IO.FileMode]::Open,
                  [IO.FileAccess]::Read,
                  [IO.FileShare]::Read)
              try {
                  $sha256 = [Security.Cryptography.SHA256]::Create()
                  try {
                      return ([BitConverter]::ToString(
                          $sha256.ComputeHash($stream))).Replace('-', '').ToLowerInvariant()
                  } finally {
                      $sha256.Dispose()
                  }
              } finally {
                  $stream.Dispose()
              }
          }

          '''
          if complete.count(helper_anchor) != 1:
              raise SystemExit(f'expected one Write-TrustedSnapshot anchor; found {complete.count(helper_anchor)}')
          if 'function Get-Sha256HexFromFile {' in complete:
              raise SystemExit('complete installer already contains Get-Sha256HexFromFile')
          complete = complete.replace(helper_anchor, file_hash_helper + helper_anchor, 1)

          file_hash_pattern = re.compile(r"\(Get-FileHash -LiteralPath (\$[A-Za-z][A-Za-z0-9]*) -Algorithm SHA256\)\.Hash\.ToLowerInvariant\(\)")
          complete, hash_count = file_hash_pattern.subn(r'Get-Sha256HexFromFile -Path \1', complete)
          if hash_count != 4:
              raise SystemExit(f'expected exactly four complete-installer Get-FileHash calls; replaced {hash_count}')

          obsolete_acl = '        $acl = Get-Acl -LiteralPath $item.FullName'
          acl_replacement = '''        $acl = $item.GetAccessControl(
              [Security.AccessControl.AccessControlSections]::Access -bor
                  [Security.AccessControl.AccessControlSections]::Owner)'''
          if complete.count(obsolete_acl) != 1:
              raise SystemExit(f'expected exactly one complete-installer Get-Acl call; found {complete.count(obsolete_acl)}')
          complete = complete.replace(obsolete_acl, acl_replacement, 1)
          complete_path.write_text(complete, encoding='utf-8')

          secure_path = Path('.github/scripts/test-fast-patch-secure-staging.ps1')
          secure = secure_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          contract_anchor = '''        Assert-Condition ($item.Content.Contains('Get-WindowsPowerShellPath')) `
              "$($item.Name) installer does not anchor privileged PowerShell launches to the protected Windows system directory."
          '''
          contract_addition = '''        Assert-Condition (-not $item.Content.Contains('Get-FileHash')) `
              "$($item.Name) installer still relies on module-autoloaded Get-FileHash in the privileged path."
          Assert-Condition (-not $item.Content.Contains('Get-Acl')) `
              "$($item.Name) installer still relies on module-autoloaded Get-Acl in the privileged path."
          '''
          if secure.count(contract_anchor) != 1:
              raise SystemExit(f'expected one static-contract anchor; found {secure.count(contract_anchor)}')
          secure = secure.replace(contract_anchor, contract_anchor + contract_addition, 1)
          secure_path.write_text(secure, encoding='utf-8')

          tooling_path = Path('.github/scripts/test-patch-tooling.ps1')
          tooling_lines = tooling_path.read_text(encoding='utf-8').replace('\r\n', '\n').splitlines(keepends=True)

          def indent_range(lines, start_marker, end_marker):
              starts = [i for i, line in enumerate(lines) if line.rstrip('\n') == start_marker]
              ends = [i for i, line in enumerate(lines) if line.rstrip('\n') == end_marker]
              if len(starts) != 1 or len(ends) != 1 or ends[0] < starts[0]:
                  raise SystemExit(f'formatting range not unique: {start_marker!r} -> {end_marker!r}; starts={starts}, ends={ends}')
              start, end = starts[0], ends[0]
              if lines[start].startswith('    '):
                  raise SystemExit(f'formatting range already indented: {start_marker!r}')
              for i in range(start, end + 1):
                  if lines[i].strip():
                      lines[i] = '    ' + lines[i]

          indent_range(
              tooling_lines,
              '$realInstallerBytes = [System.IO.File]::ReadAllBytes($realInstallerPath)',
              '}')

          # The first generic closing brace after the PE/resource assertion is its foreach end.
          # Re-resolve the mirror block independently after that edit.
          mirror_start = 'Assert-Condition ($mirrorInvocations.Count -eq 3) `'
          mirror_end = "'Installer must retain exactly one archival backup from the protected rollback snapshot.'"
          starts = [i for i, line in enumerate(tooling_lines) if line.rstrip('\n') == mirror_start]
          ends = [i for i, line in enumerate(tooling_lines) if line.rstrip('\n') == mirror_end]
          if len(starts) != 1 or len(ends) != 1 or ends[0] < starts[0]:
              raise SystemExit(f'mirror formatting range not unique; starts={starts}, ends={ends}')
          for i in range(starts[0], ends[0] + 1):
              if tooling_lines[i].strip():
                  tooling_lines[i] = '    ' + tooling_lines[i]
          tooling_path.write_text(''.join(tooling_lines), encoding='utf-8')

          complete_test_path = Path('.github/scripts/test-complete-fast-patch.ps1')
          complete_test_lines = complete_test_path.read_text(encoding='utf-8').replace('\r\n', '\n').splitlines(keepends=True)
          lifecycle_start = 'Assert-Condition ('
          lifecycle_end = ") 'Complete FastPatch base-installer delegation must reuse the existing console through the trusted process helper.'"
          starts = [i for i, line in enumerate(complete_test_lines) if line.rstrip('\n') == lifecycle_start]
          ends = [i for i, line in enumerate(complete_test_lines) if line.rstrip('\n') == lifecycle_end]
          if len(starts) != 1 or len(ends) != 1 or ends[0] < starts[0]:
              raise SystemExit(f'lifecycle formatting range not unique; starts={starts}, ends={ends}')
          for i in range(starts[0], ends[0] + 1):
              if complete_test_lines[i].strip():
                  complete_test_lines[i] = '    ' + complete_test_lines[i]
          complete_test_path.write_text(''.join(complete_test_lines), encoding='utf-8')
          '@ | Set-Content -LiteralPath .github/_fix_fastpatch_final_module.py -Encoding UTF8
          python .github/_fix_fastpatch_final_module.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath .github/_fix_fastpatch_final_module.py -Force
      - name: Parse and test FastPatch tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/Install-ProtonVPNCompletePatch.ps1',
            '.github/scripts/test-fast-patch-secure-staging.ps1',
            '.github/scripts/test-patch-tooling.ps1',
            '.github/scripts/test-complete-fast-patch.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$path : $($errors[0].Message)" }
          }
          .\.github\scripts\test-patch-tooling.ps1
          .\.github\scripts\test-complete-fast-patch.ps1
      - name: Commit tested final module cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-final-module-and-format.yml
          git rm --force .github/.fastpatch-final-module-and-format-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/Install-ProtonVPNCompletePatch.ps1 .github/scripts/test-fast-patch-secure-staging.ps1 .github/scripts/test-patch-tooling.ps1 .github/scripts/test-complete-fast-patch.ps1
          git commit -m 'Remove remaining FastPatch module dependencies'
          git push origin HEAD:security/fastpatch-immutable-staging
