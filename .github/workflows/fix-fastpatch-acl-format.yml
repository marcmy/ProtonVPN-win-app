name: Fix FastPatch ACL format

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply FastPatch ACL format'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Format ACL access-control block
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/Install-ProtonVPNPatch.ps1'
          $content = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $old = @'
        $acl = $item.GetAccessControl(
    [Security.AccessControl.AccessControlSections]::Access -bor
        [Security.AccessControl.AccessControlSections]::Owner)
'@
          $new = @'
        $acl = $item.GetAccessControl(
            [Security.AccessControl.AccessControlSections]::Access -bor
                [Security.AccessControl.AccessControlSections]::Owner)
'@
          $matches = ([regex]::Matches($content, [regex]::Escape($old))).Count
          if ($matches -ne 1) { throw "Expected exactly one ACL formatting block; found $matches" }
          $content = $content.Replace($old, $new)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
      - name: Parse and test FastPatch tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile('scripts/Install-ProtonVPNPatch.ps1',[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw $errors[0].Message }
          .\.github\scripts\test-patch-tooling.ps1
          .\.github\scripts\test-complete-fast-patch.ps1
      - name: Commit tested ACL formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-acl-format.yml
          git rm --force .github/.fastpatch-acl-format-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/Install-ProtonVPNPatch.ps1
          git commit -m 'Format FastPatch trusted-stage ACL validation'
          git push origin HEAD:security/fastpatch-immutable-staging
