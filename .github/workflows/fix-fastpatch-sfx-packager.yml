name: Fix FastPatch SFX packager

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply FastPatch SFX cleanup'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Align compiled SFX packager and regression
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          sfx_path = Path('scripts/New-ProtonVPNPatchSfx.ps1')
          lines = sfx_path.read_text(encoding='utf-8').replace('\r\n', '\n').splitlines(keepends=True)
          start_matches = [i for i, line in enumerate(lines) if line.strip() == '$removedElevationTreeWait = $false']
          end_matches = [i for i, line in enumerate(lines) if line.strip() == 'Set-Content -LiteralPath $packagedInstallerScriptPath -Value $installerLines -Encoding UTF8']
          if len(start_matches) != 1 or len(end_matches) != 1:
              raise SystemExit(f'expected exactly one legacy rewrite boundary; starts={start_matches}, ends={end_matches}')
          start = start_matches[0]
          end = end_matches[0]
          if end < start:
              raise SystemExit(f'legacy rewrite boundaries are reversed: start={start}, end={end}')
          if end + 1 < len(lines) and lines[end + 1].strip() == '':
              end += 1
          del lines[start:end + 1]
          sfx_path.write_text(''.join(lines), encoding='utf-8')

          test_path = Path('.github/scripts/test-patch-tooling.ps1')
          test = test_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          test_lines = test.splitlines(keepends=True)

          # Replace the obsolete IExpress/CAB assertion with compiled-PE/resource checks.
          tstart = [i for i, line in enumerate(test_lines) if line.strip() == '$realInstallerBytes = [System.IO.File]::ReadAllBytes($realInstallerPath)']
          tend = [i for i, line in enumerate(test_lines) if "IExpress packaging returned an executable without an embedded cabinet payload." in line]
          if len(tstart) != 1 or len(tend) != 1 or tend[0] < tstart[0]:
              raise SystemExit(f'expected one obsolete IExpress assertion; starts={tstart}, ends={tend}')
          replacement = '''    $realInstallerBytes = [System.IO.File]::ReadAllBytes($realInstallerPath)
              Assert-Condition (
                  $realInstallerBytes.Length -gt 2 -and
                  $realInstallerBytes[0] -eq 0x4D -and
                  $realInstallerBytes[1] -eq 0x5A
              ) 'Compiled FastPatch packaging did not return a valid PE executable.'
              $realInstallerAscii = [Text.Encoding]::ASCII.GetString($realInstallerBytes)
              foreach ($resourceName in @('FastPatch.Loader', 'FastPatch.Installer', 'FastPatch.Payload')) {
                  Assert-Condition ($realInstallerAscii.Contains($resourceName)) `
                      "Compiled FastPatch executable omitted embedded resource: $resourceName"
              }
          '''
          replacement = '\n'.join(line[4:] if line.startswith('    ') else line for line in replacement.split('\n'))
          test_lines[tstart[0]:tend[0] + 1] = [replacement]

          # Update the runtime-data preservation contract for protected rollback staging.
          mstarts = [i for i, line in enumerate(test_lines) if line.strip() == 'Assert-Condition ($mirrorInvocations.Count -eq 2) `']
          mforeach = [i for i, line in enumerate(test_lines) if line.strip() == 'foreach ($invocation in $mirrorInvocations) {']
          if len(mstarts) != 1 or len(mforeach) != 1 or mforeach[0] < mstarts[0]:
              raise SystemExit(f'expected obsolete mirror assertion block; starts={mstarts}, foreach={mforeach}')
          mend = next((i for i in range(mforeach[0] + 1, len(test_lines)) if test_lines[i].strip() == '}'), None)
          if mend is None:
              raise SystemExit('could not locate end of obsolete mirror assertion block')
          mirror_replacement = '''    Assert-Condition ($mirrorInvocations.Count -eq 3) `
              'Installer must have one protected snapshot, one archival backup copy, and one protected rollback mirror.'
          $serviceDataPreservingMirrors = @(
              $mirrorInvocations | Where-Object {
                  $_.Extent.Text.Contains("-ExcludedDirectories @('ServiceData')")
              }
          )
          Assert-Condition ($serviceDataPreservingMirrors.Count -eq 2) `
              'Protected rollback snapshot and restore must both preserve runtime ServiceData.'
          $archiveMirrors = @(
              $mirrorInvocations | Where-Object {
                  $_.Extent.Text.Contains('-Source $trustedRollbackDirectory') -and
                      $_.Extent.Text.Contains('-Destination $backupDirectory')
              }
          )
          Assert-Condition ($archiveMirrors.Count -eq 1) `
              'Installer must retain exactly one archival backup from the protected rollback snapshot.'
          '''
          mirror_replacement = '\n'.join(line[4:] if line.startswith('    ') else line for line in mirror_replacement.split('\n'))
          test_lines[mstarts[0]:mend + 1] = [mirror_replacement]
          test_path.write_text(''.join(test_lines), encoding='utf-8')
          '@ | Set-Content -LiteralPath .github/_fix_sfx_packager.py -Encoding UTF8
          python .github/_fix_sfx_packager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath .github/_fix_sfx_packager.py -Force
      - name: Parse and test FastPatch tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/New-ProtonVPNPatchSfx.ps1', '.github/scripts/test-patch-tooling.ps1')) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$path : $($errors[0].Message)" }
          }
          .\.github\scripts\test-patch-tooling.ps1
          .\.github\scripts\test-complete-fast-patch.ps1
      - name: Commit tested SFX packager cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-sfx-packager.yml
          git rm --force .github/.fastpatch-sfx-cleanup-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/New-ProtonVPNPatchSfx.ps1 .github/scripts/test-patch-tooling.ps1
          git commit -m 'Align FastPatch tooling with compiled SFX'
          git push origin HEAD:security/fastpatch-immutable-staging
