name: Fix FastPatch SFX packager

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply FastPatch SFX cleanup'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Remove obsolete packaged-installer rewrite
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('scripts/New-ProtonVPNPatchSfx.ps1')
          lines = path.read_text(encoding='utf-8').replace('\r\n', '\n').splitlines(keepends=True)
          start_matches = [i for i, line in enumerate(lines) if line.strip() == '$removedElevationTreeWait = $false']
          end_matches = [i for i, line in enumerate(lines) if line.strip() == 'Set-Content -LiteralPath $packagedInstallerScriptPath -Value $installerLines -Encoding UTF8']
          if len(start_matches) != 1 or len(end_matches) != 1:
              raise SystemExit(f'expected exactly one legacy rewrite boundary; starts={start_matches}, ends={end_matches}')
          start = start_matches[0]
          end = end_matches[0]
          if end < start:
              raise SystemExit(f'legacy rewrite boundaries are reversed: start={start}, end={end}')
          if end + 1 < len(lines) and lines[end + 1].strip() == '':
              end += 1
          del lines[start:end + 1]
          path.write_text(''.join(lines), encoding='utf-8')
          '@ | Set-Content -LiteralPath .github/_fix_sfx_packager.py -Encoding UTF8
          python .github/_fix_sfx_packager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath .github/_fix_sfx_packager.py -Force
      - name: Parse and test FastPatch tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile('scripts/New-ProtonVPNPatchSfx.ps1',[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw $errors[0].Message }
          .\.github\scripts\test-patch-tooling.ps1
          .\.github\scripts\test-complete-fast-patch.ps1
      - name: Commit tested SFX packager cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-sfx-packager.yml
          git rm --force .github/.fastpatch-sfx-cleanup-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/New-ProtonVPNPatchSfx.ps1
          git commit -m 'Remove obsolete FastPatch SFX elevation rewrite'
          git push origin HEAD:security/fastpatch-immutable-staging
