name: Fix compiled FastPatch loader trim

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Fix loader TrimEnd literal
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/New-ProtonVPNPatchSfx.ps1')
          text = path.read_text(encoding='utf-8')
          old = "TrimEnd('\\\\', '/')"
          new = "TrimEnd('\\', '/')"
          if text.count(old) != 1:
              raise RuntimeError(f'Expected exactly one bad TrimEnd literal, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Parse updated builder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void] [Management.Automation.Language.Parser]::ParseFile('scripts/New-ProtonVPNPatchSfx.ps1', [ref] $tokens, [ref] $errors)
          if ($errors.Count -gt 0) {
              throw "Updated SFX builder does not parse: $($errors[0].Message)"
          }

      - name: Remove one-time workflow and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-sfx-trimend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/New-ProtonVPNPatchSfx.ps1
          git commit -m 'Fix compiled FastPatch loader path normalization'
          git push origin HEAD:security/fastpatch-immutable-staging
