name: Temporary Smart Routing localization applicator

on:
  pull_request:
    branches:
      - marc/proton
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: smart-routing-localization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pipeline:
    if: github.head_ref == 'agent/port-smart-routing-presentation'
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Apply recovered Smart Routing localization
        run: .\.github\scripts\apply-smart-routing-localization-temp.ps1
