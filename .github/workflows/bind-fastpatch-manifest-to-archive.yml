name: Bind FastPatch manifest to verified archive

on:
  push:
    branches:
      - security/fastpatch-immutable-staging
    paths:
      - .github/scripts/bind-fastpatch-manifest-to-archive.py
      - .github/workflows/bind-fastpatch-manifest-to-archive.yml

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/fastpatch-immutable-staging

      - name: Bind manifest validation to verified ZIP bytes
        run: python .github/scripts/bind-fastpatch-manifest-to-archive.py

      - name: Remove one-time archive-binding machinery
        run: |
          rm .github/scripts/bind-fastpatch-manifest-to-archive.py
          rm .github/workflows/bind-fastpatch-manifest-to-archive.yml

      - name: Commit archive manifest binding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Bind FastPatch manifest validation to verified archive"
          git push origin HEAD:security/fastpatch-immutable-staging
