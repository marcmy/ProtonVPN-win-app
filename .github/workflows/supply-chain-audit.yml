name: Supply-chain audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - marc/proton
  schedule:
    # Every Monday at 07:23 UTC
    - cron: "23 7 * * 1"

permissions: {}

jobs:
  trivy:
    name: Trivy security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'marc/proton' || github.ref }}
          persist-credentials: false
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

          # New unignored high/critical findings must fail the audit.
          exit-code: "1"

      - name: Upload findings to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif

  syft:
    name: Generate independent SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'marc/proton' || github.ref }}
          persist-credentials: false
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          config: .syft.yaml
          format: spdx-json
          artifact-name: sbom.spdx.json

          # Pull requests get a real SBOM check without a write-capable token.
          dependency-snapshot: false
          upload-artifact: true
          upload-release-assets: false
