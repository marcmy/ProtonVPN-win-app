name: Supply-chain audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-target:
    name: Patch target branch
    if: ${{ github.head_ref == 'agent/proton-5.1.7-archaeology' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/port-proton-5.1.7-fixes
          persist-credentials: true

      - name: Fix nullable state projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/Client/Logic/Servers/ProtonVPN.Client.Logic.Servers/Cache/ServersCache.cs')
          data = p.read_bytes()
          bom = data.startswith(b'\xef\xbb\xbf')
          text = data.decode('utf-8-sig')
          pattern = re.compile(
              r'(\.Where\(state => !string\.IsNullOrWhiteSpace\(state\)\)\n)'
              r'(\s*)'
              r'(\.Distinct\(\)\n\s*\.ToList\(\)!;)')
          text, count = pattern.subn(
              lambda m: m.group(1) + m.group(2) + '.Select(state => state!)\n' + m.group(2) + m.group(3),
              text,
              count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one nullable city projection, found {count}')
          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)
          PY
          git diff --check
          git diff

      - name: Commit and push target branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Client/Logic/Servers/ProtonVPN.Client.Logic.Servers/Cache/ServersCache.cs
          git commit -m "Fix city state nullability"
          git push origin HEAD:agent/port-proton-5.1.7-fixes
