name: Supply-chain audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - marc/proton
  schedule:
    # Every Monday at 07:23 UTC
    - cron: "23 7 * * 1"

permissions: {}

jobs:
  trivy:
    name: Trivy security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'marc/proton' || github.ref }}
          persist-credentials: false
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

          # New unignored high/critical findings must fail the audit.
          exit-code: "1"

      - name: Upload findings to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif

  syft:
    name: Generate independent SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'marc/proton' || github.ref }}
          persist-credentials: false
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          config: .syft.yaml
          format: spdx-json
          artifact-name: sbom.spdx.json

          # Pull requests get a real SBOM check without a write-capable token.
          dependency-snapshot: false
          upload-artifact: true
          upload-release-assets: false

  proton-5-1-7-archaeology:
    name: Extract and decompile Proton VPN 5.1.7
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/proton-5.1.7-archaeology' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install extraction build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libboost-all-dev \
            liblzma-dev

      - name: Build Inno Setup 6.6-capable innoextract
        run: |
          set -euxo pipefail
          mkdir -p tools
          git clone --depth 1 \
            --branch inno-6.4-to-6.7-support \
            https://github.com/dscho/innoextract.git \
            tools/innoextract-src
          cmake -S tools/innoextract-src -B tools/innoextract-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/innoextract-build --target innoextract --parallel 2
          find tools/innoextract-build -type f -name innoextract -perm -111 -print

      - name: Download and verify Proton VPN 5.1.7
        run: |
          set -euxo pipefail
          mkdir -p archaeology
          curl --fail --location --retry 3 --retry-delay 2 \
            --output archaeology/ProtonVPN_v5.1.7_x64.exe \
            https://protonvpn.com/download/ProtonVPN_v5.1.7_x64.exe
          echo "ab8c87d7db3cb76271df72186c1af0831362671b145acc449a8443a415379c8a  archaeology/ProtonVPN_v5.1.7_x64.exe" | sha256sum --check

      - name: Extract installer payload
        run: |
          set -euxo pipefail
          INNOEXTRACT="$(find tools/innoextract-build -type f -name innoextract -perm -111 -print -quit)"
          test -n "$INNOEXTRACT"
          "$INNOEXTRACT" \
            --extract \
            --output-dir archaeology/extracted \
            archaeology/ProtonVPN_v5.1.7_x64.exe \
            | tee archaeology/innoextract.log
          find archaeology/extracted -type f -printf '%P\n' | sort > archaeology/extracted-files.txt
          CLIENT_DLL="$(find archaeology/extracted -type f -iname 'ProtonVPN.Client.dll' -print -quit)"
          test -n "$CLIENT_DLL"
          dirname "$CLIENT_DLL" > archaeology/app-directory.txt

      - name: Collect first-party assemblies
        run: |
          set -euxo pipefail
          APPDIR="$(cat archaeology/app-directory.txt)"
          mkdir -p archaeology/assemblies archaeology/decompiled
          find "$APPDIR" -maxdepth 1 -type f -iname 'ProtonVPN*.dll' -print0 \
            | sort -z \
            | xargs -0 -I{} cp -v '{}' archaeology/assemblies/
          sha256sum archaeology/assemblies/* | sort > archaeology/assembly-sha256.txt

          {
            find archaeology/assemblies -maxdepth 1 -type f -iname 'ProtonVPN.Client.dll'
            find archaeology/assemblies -maxdepth 1 -type f -iname 'ProtonVPN.Client.Logic.Connection*.dll'
            find archaeology/assemblies -maxdepth 1 -type f -iname 'ProtonVPN.Client.Logic.Recents*.dll'
            find archaeology/assemblies -maxdepth 1 -type f -iname 'ProtonVPN.Client.Logic.Searches*.dll'
            find archaeology/assemblies -maxdepth 1 -type f -iname 'ProtonVPN.Client.Logic.Servers*.dll'
            find archaeology/assemblies -maxdepth 1 -type f -iname 'ProtonVPN*Update*.dll'
          } | sort -u > archaeology/decompile-targets.txt
          cat archaeology/decompile-targets.txt

      - name: Decompile target assemblies with ILSpy
        run: |
          set -euxo pipefail
          dotnet tool install --tool-path tools/ilspy ilspycmd
          tools/ilspy/ilspycmd --version | tee archaeology/ilspy-version.txt

          while IFS= read -r dll; do
            test -n "$dll" || continue
            name="$(basename "$dll" .dll)"
            mkdir -p "archaeology/decompiled/$name"
            tools/ilspy/ilspycmd \
              --project \
              --outputdir "archaeology/decompiled/$name" \
              "$dll"
          done < archaeology/decompile-targets.txt

      - name: Upload archaeology bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protonvpn-5.1.7-binary-archaeology
          path: |
            archaeology/assemblies
            archaeology/decompiled
            archaeology/innoextract.log
            archaeology/extracted-files.txt
            archaeology/app-directory.txt
            archaeology/assembly-sha256.txt
            archaeology/decompile-targets.txt
            archaeology/ilspy-version.txt
          if-no-files-found: error
          retention-days: 1
