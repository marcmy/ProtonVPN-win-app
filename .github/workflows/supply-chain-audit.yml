name: Supply-chain audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - marc/proton-main
  schedule:
    # Every Monday at 07:23 UTC
    - cron: "23 7 * * 1"

permissions: {}

jobs:
  nuget-lockfiles:
    name: Restore resolved NuGet dependency graph
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'schedule' && 'marc/proton-main' || github.sha }}
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Test the graph parser's fail-closed behavior
        run: python .github/scripts/test_nuget_snapshot.py
      - name: Restore supported Windows projects with lockfiles
        run: ./.github/scripts/restore-nuget-lockfiles.ps1
      - name: Verify transitive NuGet graph
        run: python .github/scripts/submit-nuget-snapshot.py
      - name: Export generated lockfiles to SBOM job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-lockfiles-${{ github.run_id }}
          path: src/**/packages.lock.json
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Trivy security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'schedule' && 'marc/proton-main' || github.sha }}
          persist-credentials: false
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

          # New unignored high/critical findings must fail the audit.
          exit-code: "1"

      - name: Upload findings to GitHub Security
        if: success() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif

  syft:
    name: Generate independent SBOM
    needs: nuget-lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'schedule' && 'marc/proton-main' || github.sha }}
          persist-credentials: false
      - name: Import restored NuGet lockfiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-lockfiles-${{ github.run_id }}
          path: src
      - name: Confirm restored NuGet evidence is present
        shell: bash
        run: |
          count=$(find src -name packages.lock.json -type f | wc -l)
          test "$count" -ge 3 || { echo "::error::NuGet lockfile coverage missing ($count)"; exit 1; }
          grep -R -i -q '"log4net"' src --include=packages.lock.json || {
            echo "::error::Resolved log4net dependency absent from SBOM inputs"
            exit 1
          }
          echo "Syft input includes $count restored NuGet lockfiles"
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          config: .syft.yaml
          format: spdx-json
          artifact-name: sbom.spdx.json

          # Pull requests get a real SBOM check without a write-capable token.
          dependency-snapshot: false
          upload-artifact: true
          upload-release-assets: false
