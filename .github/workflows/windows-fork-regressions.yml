name: Windows fork regression tests

on:
  pull_request:
    branches:
      - marc/proton
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  NUGET_XMLDOC_MODE: skip
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

concurrency:
  group: windows-fork-regressions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    name: Run fork regression tests (${{ matrix.test_group }})
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - test_group: Ui
            repeat_server_health: true
          - test_group: Core
            repeat_server_health: false
          - test_group: Integration
            repeat_server_health: false

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Prepare regression logs
        run: New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null

      - name: Run fork regression tests
        env:
          TEST_GROUP: ${{ matrix.test_group }}
          REPEAT_SERVER_HEALTH: ${{ matrix.repeat_server_health }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repeatServerHealth = [bool]::Parse($env:REPEAT_SERVER_HEALTH)
          .\.github\scripts\test-fork-regressions.ps1 `
            -Scope All `
            -TestGroup $env:TEST_GROUP `
            -LogsDirectory artifacts/logs `
            -RepeatServerHealth:$repeatServerHealth
