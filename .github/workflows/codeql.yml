# Advanced CodeQL candidate: builds C# on Windows instead of Linux buildless extraction.
# Until GitHub Default Setup is disabled, this runs in validation-only mode:
# no SARIF upload, so it cannot conflict with Default Setup.
# After switching CodeQL to Advanced Setup, set repository variable
# ENABLE_ADVANCED_CODEQL=true to enable uploads on the maintained branch.
name: CodeQL advanced Windows / Python

on:
  workflow_dispatch:
  push:
    branches: [marc/proton-main]
  pull_request:
    branches: [marc/proton-main]
  schedule:
    - cron: '31 6 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-advanced-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.ENABLE_ADVANCED_CODEQL == 'true'
    name: Advanced CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            mode: manual
          - language: python
            os: ubuntu-24.04
            mode: none
          - language: cpp
            os: ubuntu-24.04
            mode: none
          - language: actions
            os: ubuntu-24.04
            mode: none

    env:
      CODEQL_EXTRACTOR_PYTHON_ANALYSIS_VERSION: '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13 (avoid runner Python 3.14 probing)
        if: matrix.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Set up .NET 10 for Windows C# analysis
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Set up MSBuild
        if: matrix.language == 'csharp'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          queries: security-extended
      - name: Restore and compile both Windows app processes for CodeQL
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'src/Client/ProtonVPN.Client/ProtonVPN.Client.csproj',
            'src/ProtonVPN.Service/ProtonVPN.Service.csproj',
            'src/ProtonVPN.Launcher/ProtonVPN.Launcher.csproj'
          )
          foreach ($project in $projects) {
            & dotnet restore $project --runtime win-x64 -p:Platform=x64 --disable-parallel -m:1
            if ($LASTEXITCODE -ne 0) { throw "CodeQL restore failed: $project" }
            & dotnet build $project -c Release --runtime win-x64 --no-restore -p:Platform=x64 -p:BuildInParallel=false -m:1
            if ($LASTEXITCODE -ne 0) { throw "CodeQL build failed: $project" }
          }
      - name: Analyze source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: '/language:${{ matrix.language }}'
          upload: ${{ vars.ENABLE_ADVANCED_CODEQL == 'true' && 'always' || 'never' }}
