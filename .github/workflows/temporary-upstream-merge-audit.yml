name: Temporary upstream merge candidate
on:
  push:
    branches:
      - integration/proton-5.1.9-20261109
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate conservative review candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/ProtonVPN/win-app.git bd8380fe92c2b07f07ee6e48858307f12780fcb9
          echo '### Merge strategy' >> "$GITHUB_STEP_SUMMARY"
          echo 'Provisional -X ours conflict hunk preference; independent upstream changes are retained. Manual review required for previously conflicting paths.' >> "$GITHUB_STEP_SUMMARY"
          git merge --no-ff --no-commit -X ours FETCH_HEAD
          if test -n "$(git ls-files -u)"; then
            echo "Unresolved conflicts remain; refusing to publish candidate"
            git ls-files -u
            exit 1
          fi
          git diff --cached --check || echo 'Whitespace check warning' >> "$GITHUB_STEP_SUMMARY"
          git commit -m 'Merge ProtonVPN upstream master 5.1.9 (review candidate; conflict hunks favor fork)'
          git rm .github/workflows/temporary-upstream-merge-audit.yml
          git commit -m 'ci: remove temporary upstream merge workflow'
          echo '--- merge parents ---'
          git show -s --pretty='%H %P' HEAD^
          echo '--- changes relative to fork ---'
          git diff --stat 9c424be34e0f193116bc1c67ca4280b78304cf87..HEAD | tail -n 40
          git push origin HEAD:refs/heads/integration/proton-5.1.9-20261109
          echo 'Review candidate pushed to isolated integration branch.' >> "$GITHUB_STEP_SUMMARY"
