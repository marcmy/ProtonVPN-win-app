name: Fix FastPatch path normalization

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Apply FastPatch path normalization'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Restore single-backslash ZIP entry normalization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          path = Path('scripts/New-ProtonVPNPatchSfx.ps1')
          content = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = "$_.FullName.Replace('\\\\', '/')"
          new = "$_.FullName.Replace('\\', '/')"
          count = content.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one double-backslash ZIP normalization; found {count}')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          '@ | Set-Content -LiteralPath .github/_fix_path_normalization.py -Encoding UTF8
          python .github/_fix_path_normalization.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath .github/_fix_path_normalization.py -Force
      - name: Parse and test FastPatch tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile('scripts/New-ProtonVPNPatchSfx.ps1',[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw $errors[0].Message }
          .\.github\scripts\test-patch-tooling.ps1
      - name: Commit tested path normalization fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-fastpatch-path-normalization.yml
          git rm --force .github/.fastpatch-path-normalization-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/New-ProtonVPNPatchSfx.ps1
          git commit -m 'Restore FastPatch ZIP path normalization'
          git push origin HEAD:security/fastpatch-immutable-staging
