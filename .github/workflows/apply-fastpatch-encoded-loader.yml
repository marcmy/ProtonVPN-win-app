name: Apply FastPatch encoded loader

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Transform verified SFX memory path
        shell: pwsh
        run: python .github/scripts/_temp_fastpatch_memory_transform.py
      - name: Parse transformed production scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/New-ProtonVPNPatchSfx.ps1','scripts/Install-ProtonVPNPatch.ps1','scripts/Install-ProtonVPNCompletePatch.ps1')) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$path : $($errors[0].Message)" }
          }
      - name: Commit verified memory path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git restore .github/workflows/adapt-fastpatch-compiled-sfx-tests.yml
          git rm --force .github/scripts/_temp_fastpatch_memory_transform.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/New-ProtonVPNPatchSfx.ps1 scripts/Install-ProtonVPNPatch.ps1 scripts/Install-ProtonVPNCompletePatch.ps1
          git commit -m 'Consume SFX archive from verified process memory'
          git push origin HEAD:security/fastpatch-immutable-staging
