name: Apply FastPatch encoded loader

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Replace stdin loader with direct EncodedCommand
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $builder = 'scripts/New-ProtonVPNPatchSfx.ps1'
          $text = [IO.File]::ReadAllText($builder)
          $old = @'
              private static int RunPowerShell(string loaderText, string workingDirectory)
              {
                  ProcessStartInfo startInfo = new ProcessStartInfo();
                  startInfo.FileName = GetWindowsPowerShellPath();
                  startInfo.Arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -Command -";
                  startInfo.WorkingDirectory = workingDirectory;
                  startInfo.UseShellExecute = false;
                  startInfo.RedirectStandardInput = true;
                  startInfo.CreateNoWindow = false;

                  using (Process process = Process.Start(startInfo))
                  {
                      if (process == null)
                      {
                          throw new InvalidOperationException("Could not start Windows PowerShell for FastPatch.");
                      }
                      process.StandardInput.Write(loaderText);
                      process.StandardInput.Close();
                      process.WaitForExit();
                      return process.ExitCode;
                  }
              }
          '@
          $new = @'
              private static int RunPowerShell(string loaderText, string workingDirectory)
              {
                  string encodedCommand = Convert.ToBase64String(Encoding.Unicode.GetBytes(loaderText));
                  if (encodedCommand.Length > 30000)
                  {
                      throw new InvalidOperationException("Embedded FastPatch loader exceeds the safe Windows command-line budget: " + encodedCommand.Length + " characters.");
                  }

                  ProcessStartInfo startInfo = new ProcessStartInfo();
                  startInfo.FileName = GetWindowsPowerShellPath();
                  startInfo.Arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand " + encodedCommand;
                  startInfo.WorkingDirectory = workingDirectory;
                  startInfo.UseShellExecute = false;
                  startInfo.CreateNoWindow = false;

                  using (Process process = Process.Start(startInfo))
                  {
                      if (process == null)
                      {
                          throw new InvalidOperationException("Could not start Windows PowerShell for FastPatch.");
                      }
                      process.WaitForExit();
                      return process.ExitCode;
                  }
              }
          '@
          if (-not $text.Contains($old)) { throw 'stdin RunPowerShell block not found exactly.' }
          [IO.File]::WriteAllText($builder, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))

          $adapter = '.github/workflows/adapt-fastpatch-compiled-sfx-tests.yml'
          $atext = [IO.File]::ReadAllText($adapter)
          $oldContract = @'
                        Assert-Condition ($sfx.Contains('RedirectStandardInput = true')) `
                            'Compiled SFX does not feed its trusted loader directly to system PowerShell over stdin.'
                        Assert-Condition ($sfx.Contains('Arguments = \"-NoProfile -NonInteractive -ExecutionPolicy Bypass -Command -\"')) `
                            'Compiled SFX does not execute the embedded loader from stdin in protected system PowerShell.'
                        Assert-Condition ($sfx.Contains('process.StandardInput.Write(loaderText)')) `
                            'Compiled SFX does not send the embedded verified loader bytes directly to PowerShell.'
          '@
          $newContract = @'
                        Assert-Condition ($sfx.Contains('Encoding.Unicode.GetBytes(loaderText)')) `
                            'Compiled SFX does not encode the verified embedded loader bytes directly for Windows PowerShell.'
                        Assert-Condition ($sfx.Contains('-EncodedCommand \" + encodedCommand')) `
                            'Compiled SFX does not execute the verified embedded loader through direct system PowerShell EncodedCommand.'
                        Assert-Condition ($sfx.Contains('encodedCommand.Length > 30000')) `
                            'Compiled SFX does not enforce the Windows command-line budget for its in-memory loader.'
                        Assert-Condition (-not $sfx.Contains('RedirectStandardInput = true')) `
                            'Compiled SFX still relies on the failed PowerShell stdin loader path.'
          '@
          if (-not $atext.Contains($oldContract)) { throw 'adapter stdin static-contract block not found exactly.' }
          [IO.File]::WriteAllText($adapter, $atext.Replace($oldContract, $newContract), [Text.UTF8Encoding]::new($false))

      - name: Parse updated builder
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile('scripts/New-ProtonVPNPatchSfx.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw $errors[0].Message }

      - name: Commit transformation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/New-ProtonVPNPatchSfx.ps1 .github/workflows/adapt-fastpatch-compiled-sfx-tests.yml
          git commit -m 'Run compiled FastPatch loader without a mutable path'
          git push origin HEAD:security/fastpatch-immutable-staging
