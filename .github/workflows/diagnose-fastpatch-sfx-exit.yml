name: Diagnose FastPatch IExpress exit

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Run focused IExpress smoke with process diagnostics
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/scripts/test-fast-patch-secure-staging.ps1'
          $content = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")

          $oldLaunch = @'
              $previousProbe = $env:PROTONVPN_FASTPATCH_SFX_PROBE
              $previousSystemRoot = $env:SystemRoot
              $fakeSystemRoot = Join-Path $fixtureRoot 'attacker-system-root'
              $fakePowerShellDirectory = Join-Path $fakeSystemRoot 'System32\WindowsPowerShell\v1.0'
              New-Item -ItemType Directory -Force -Path $fakePowerShellDirectory | Out-Null
              # If the SFX still expands %SystemRoot%, this renamed cmd.exe receives the PowerShell
              # arguments and the smoke probe never gets written. GLOBALROOT must bypass it entirely.
              Copy-Item `
                  -LiteralPath (Join-Path $previousSystemRoot 'System32\cmd.exe') `
                  -Destination (Join-Path $fakePowerShellDirectory 'powershell.exe') `
                  -Force
              try {
                  $env:PROTONVPN_FASTPATCH_SFX_PROBE = $probe
                  $env:SystemRoot = $fakeSystemRoot
                  $process = Start-Process -FilePath $output -PassThru
                  if (-not $process.WaitForExit(90000)) {
                      Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                      throw 'IExpress SFX smoke run did not terminate within 90 seconds.'
                  }
                  Assert-Condition ($process.ExitCode -eq 0) "IExpress SFX smoke run failed with exit code $($process.ExitCode)."
              } finally {
                  $env:SystemRoot = $previousSystemRoot
                  $env:PROTONVPN_FASTPATCH_SFX_PROBE = $previousProbe
              }
          '@
          $newLaunch = @'
              $previousProbe = $env:PROTONVPN_FASTPATCH_SFX_PROBE
              try {
                  $env:PROTONVPN_FASTPATCH_SFX_PROBE = $probe
                  $process = Start-Process -FilePath $output -PassThru
                  if (-not $process.WaitForExit(20000)) {
                      $probeExists = Test-Path -LiteralPath $probe -PathType Leaf
                      Write-Host "SFX_DIAG timeout parentPid=$($process.Id) probeExists=$probeExists"
                      if ($probeExists) {
                          Write-Host 'SFX_DIAG probe:'
                          Get-Content -LiteralPath $probe -Raw | Write-Host
                      }
                      Write-Host 'SFX_DIAG relevant processes:'
                      Get-CimInstance Win32_Process |
                          Where-Object {
                              $_.ProcessId -eq $process.Id -or
                              $_.ParentProcessId -eq $process.Id -or
                              $_.Name -match '^(wextract|powershell|cmd|conhost)\.exe$'
                          } |
                          Select-Object ProcessId, ParentProcessId, Name, CommandLine |
                          Format-List | Out-String | Write-Host
                      Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                      throw 'IExpress SFX diagnostic smoke did not terminate within 20 seconds.'
                  }
                  Write-Host "SFX_DIAG exited code=$($process.ExitCode)"
                  Assert-Condition ($process.ExitCode -eq 0) "IExpress SFX smoke run failed with exit code $($process.ExitCode)."
              } finally {
                  $env:PROTONVPN_FASTPATCH_SFX_PROBE = $previousProbe
              }
          '@
          if (-not $content.Contains($oldLaunch)) {
              throw 'Expected IExpress smoke launch block was not found.'
          }
          $content = $content.Replace($oldLaunch, $newLaunch)

          $oldCalls = @'
              Test-StaticSecurityContracts
              Test-BootstrapSuccessAndAcl
              Test-MutatedPayloadRejected -Kind Runtime
              Test-MutatedPayloadRejected -Kind Helper
              Test-MutatedInstallerRejected
              Test-VerifiedArchiveManifestSurvivesExtractionRace
              Test-SfxLoaderRejectsMutatedInstaller
              Test-IExpressVerifiedInMemoryEntry
              Test-ReparseSourceRejected
              Test-BaseInstallerEndToEnd
              Test-CompleteLauncherRollbackAfterProtectedStageFailure
          '@
          $newCalls = @'
              Test-StaticSecurityContracts
              Test-SfxLoaderRejectsMutatedInstaller
              Test-IExpressVerifiedInMemoryEntry
          '@
          if (-not $content.Contains($oldCalls)) {
              throw 'Expected secure-staging test invocation block was not found.'
          }
          $content = $content.Replace($oldCalls, $newCalls)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))

          $tokens = $null
          $errors = $null
          [void] [Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $errors)
          if ($errors.Count -gt 0) {
              throw "Diagnostic test rewrite does not parse: $($errors[0].Message)"
          }

          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path
          exit $LASTEXITCODE

      - name: Remove diagnostic workflow
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/diagnose-fastpatch-sfx-exit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove FastPatch IExpress diagnostic workflow'
          git push origin HEAD:security/fastpatch-immutable-staging
