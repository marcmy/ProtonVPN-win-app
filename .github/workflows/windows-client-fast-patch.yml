name: Windows fast patch build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: What to build
        type: choice
        required: true
        default: both
        options:
          - client
          - service
          - both
      upload_full_bin:
        description: Upload full src/bin output
        type: boolean
        required: true
        default: false
      target_version:
        description: Optional Proton VPN release version
        type: string
        required: false
        default: ''
  pull_request:
    branches:
      - marc/proton
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  NUGET_XMLDOC_MODE: skip
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

concurrency:
  group: windows-fast-patch-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.build_mode || 'both' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    name: Run fork regression tests (${{ matrix.test_group }})
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - test_group: Ui
            repeat_server_health: true
          - test_group: Core
            repeat_server_health: false
          - test_group: Integration
            repeat_server_health: false

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Prepare regression logs
        run: New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null

      - name: Run fork regression tests
        env:
          TEST_GROUP: ${{ matrix.test_group }}
          REPEAT_SERVER_HEALTH: ${{ matrix.repeat_server_health }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repeatServerHealth = [bool]::Parse($env:REPEAT_SERVER_HEALTH)
          .\.github\scripts\test-fork-regressions.ps1 `
            -Scope All `
            -TestGroup $env:TEST_GROUP `
            -LogsDirectory artifacts/logs `
            -RepeatServerHealth:$repeatServerHealth

  pipeline:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Build {0} patch artifact', inputs.build_mode) || 'Build and package client and service changes' }}
    runs-on: windows-latest
    timeout-minutes: 90

    outputs:
      build_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'both' }}
      target_version: ${{ steps.app-version.outputs.target_version }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore focused NuGet cache
        id: nuget-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/AppData/Local/NuGet/v3-cache
            ~/.nuget/packages/microsoft.windowsappsdk*
            ~/.nuget/packages/microsoft.windows.sdk.buildtools
          key: windows-nuget-winui-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            windows-nuget-winui-

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Prepare artifact folders
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/logs | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/ProtonVPN.Client.Patch | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/Installer | Out-Null

      - name: Clean previous build output
        if: github.event_name == 'workflow_dispatch'
        run: |
          Remove-Item -LiteralPath src/bin -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath artifacts/client-build-output -Recurse -Force -ErrorAction SilentlyContinue

      - name: Resolve target app version
        id: app-version
        env:
          REQUESTED_TARGET_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.target_version || '' }}
        run: |
          $ErrorActionPreference = 'Stop'

          $requestedVersion = $env:REQUESTED_TARGET_VERSION.Trim()
          $assemblyInfoPath = 'src/GlobalAssemblyInfo.cs'

          if ($requestedVersion -eq '') {
            if (-not (Test-Path -LiteralPath $assemblyInfoPath -PathType Leaf)) {
              throw "Assembly info file was not found: $assemblyInfoPath"
            }

            $content = Get-Content -LiteralPath $assemblyInfoPath -Raw
            $match = [regex]::Match($content, '\[assembly:\s*AssemblyVersion\("(?<version>[^"\)]+)"\)\]')
            if (-not $match.Success) {
              throw "Could not determine the Proton VPN release version from $assemblyInfoPath"
            }

            $requestedVersion = $match.Groups['version'].Value
            Write-Host "No target_version override provided; using AssemblyVersion $requestedVersion."
          }

          if ($requestedVersion -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "target_version must be a numeric three- or four-part version. Received '$requestedVersion'."
          }

          $parsedVersion = [Version]::Parse($requestedVersion)
          if ($parsedVersion.Build -lt 0) {
            throw "target_version must contain at least three numeric parts. Received '$requestedVersion'."
          }

          $targetVersion = '{0}.{1}.{2}' -f $parsedVersion.Major, $parsedVersion.Minor, $parsedVersion.Build

          if ($env:REQUESTED_TARGET_VERSION.Trim() -ne '') {
            Write-Host "Stamping build output for Proton VPN release $targetVersion."
            .\.github\scripts\set-assembly-version.ps1 -TargetVersion $targetVersion
          }

          Write-Host "Exact installed target folder: v$targetVersion"
          "target_version=$targetVersion" >> $env:GITHUB_OUTPUT

      - name: Test patch automation
        run: .\.github\scripts\test-patch-tooling.ps1

      - name: Run fork regression tests
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scope = switch ($env:REQUESTED_BUILD_MODE) {
            'client' { 'Client' }
            'service' { 'Service' }
            default { 'All' }
          }

          $repeatServerHealth = $scope -in @('Client', 'All')
          .\.github\scripts\test-fork-regressions.ps1 `
            -Scope $scope `
            -LogsDirectory artifacts/logs `
            -RepeatServerHealth:$repeatServerHealth

      - name: Restore client project
        if: ${{ github.event_name == 'pull_request' || inputs.build_mode == 'client' || inputs.build_mode == 'both' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          dotnet restore src/Client/ProtonVPN.Client/ProtonVPN.Client.csproj --runtime win-x64 -p:RestoreUseStaticGraphEvaluation=true -bl:artifacts/logs/client-restore.binlog *>&1 |
            Tee-Object -FilePath artifacts/logs/client-restore.log

          if ($LASTEXITCODE -ne 0) {
            throw "Client restore failed with exit code $LASTEXITCODE"
          }

      - name: Restore service project
        if: ${{ github.event_name == 'pull_request' || inputs.build_mode == 'service' || inputs.build_mode == 'both' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          dotnet restore src/ProtonVPN.Service/ProtonVPN.Service.csproj --runtime win-x64 -p:RestoreUseStaticGraphEvaluation=true -bl:artifacts/logs/service-restore.binlog *>&1 |
            Tee-Object -FilePath artifacts/logs/service-restore.log

          if ($LASTEXITCODE -ne 0) {
            throw "Service restore failed with exit code $LASTEXITCODE"
          }

      - name: Build client project
        if: ${{ github.event_name == 'pull_request' || inputs.build_mode == 'client' || inputs.build_mode == 'both' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          dotnet build src/Client/ProtonVPN.Client/ProtonVPN.Client.csproj --configuration Release --runtime win-x64 --no-restore -p:Platform=x64 -v:minimal -bl:artifacts/logs/client-build.binlog *>&1 |
            Tee-Object -FilePath artifacts/logs/client-build.log

          if ($LASTEXITCODE -ne 0) {
            throw "Client build failed with exit code $LASTEXITCODE"
          }

      - name: Stage client patch build output
        if: ${{ github.event_name == 'pull_request' || inputs.build_mode == 'client' || inputs.build_mode == 'both' }}
        run: |
          .\.github\scripts\stage-client-patch-output.ps1

      - name: Build service project
        if: ${{ github.event_name == 'pull_request' || inputs.build_mode == 'service' || inputs.build_mode == 'both' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          dotnet build src/ProtonVPN.Service/ProtonVPN.Service.csproj --configuration Release --runtime win-x64 --no-restore -p:Platform=x64 -v:minimal -bl:artifacts/logs/service-build.binlog *>&1 |
            Tee-Object -FilePath artifacts/logs/service-build.log

          if ($LASTEXITCODE -ne 0) {
            throw "Service build failed with exit code $LASTEXITCODE"
          }

      - name: Package versioned patch artifacts
        id: package
        env:
          BUILD_MODE: ${{ github.event_name == 'pull_request' && 'both' || inputs.build_mode }}
          TARGET_VERSION: ${{ steps.app-version.outputs.target_version }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          .\.github\scripts\package-patch-artifacts.ps1 `
            -BuildMode $env:BUILD_MODE `
            -TargetVersion $env:TARGET_VERSION `
            -SourceCommit $env:SOURCE_COMMIT `
            -SourceRef $env:SOURCE_REF `
            -WorkflowRunId $env:WORKFLOW_RUN_ID

      - name: Upload PR raw patch artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protonvpn-client-patch-${{ steps.app-version.outputs.target_version }}-pr-${{ github.event.pull_request.number }}
          path: artifacts/ProtonVPN.Client.Patch
          if-no-files-found: error
          retention-days: 3

      - name: Upload PR installer artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protonvpn-custom-patch-installer-${{ steps.app-version.outputs.target_version }}-pr-${{ github.event.pull_request.number }}
          path: artifacts/Installer/*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload raw patch artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protonvpn-client-patch-${{ steps.app-version.outputs.target_version }}-${{ inputs.build_mode }}
          path: artifacts/ProtonVPN.Client.Patch
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protonvpn-custom-patch-installer-${{ steps.app-version.outputs.target_version }}-${{ inputs.build_mode }}
          path: artifacts/Installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload full bin artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_full_bin && hashFiles('src/bin/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protonvpn-client-bin-${{ steps.app-version.outputs.target_version }}-${{ inputs.build_mode }}
          path: src/bin
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: ${{ github.event_name == 'workflow_dispatch' && always() && hashFiles('artifacts/logs/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protonvpn-client-patch-logs-${{ steps.app-version.outputs.target_version }}-${{ inputs.build_mode }}
          path: artifacts/logs
          if-no-files-found: ignore
          retention-days: 7

  attest:
    name: Attest patch artifacts
    if: github.event_name == 'workflow_dispatch'
    needs: pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download raw patch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protonvpn-client-patch-${{ needs.pipeline.outputs.target_version }}-${{ needs.pipeline.outputs.build_mode }}
          path: artifacts-to-attest/raw-patch

      - name: Download installer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protonvpn-custom-patch-installer-${{ needs.pipeline.outputs.target_version }}-${{ needs.pipeline.outputs.build_mode }}
          path: artifacts-to-attest/installer

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts-to-attest/raw-patch/patch-manifest.json
            artifacts-to-attest/installer/*.exe