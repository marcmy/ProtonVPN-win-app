name: Improve SFX loader mutation diagnostics

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  improve:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Preserve child loader output on assertion failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/scripts/test-fast-patch-secure-staging.ps1'
          $content = Get-Content -LiteralPath $path -Raw
          $old = @'
              Assert-Condition ($exitCode -ne 0) 'Hash-pinned SFX loader executed a mutated extracted installer.'
              Assert-Condition (($output -join [Environment]::NewLine) -match 'installer hash mismatch') `
                  'SFX loader rejected the mutated installer for an unexpected reason.'
          '@
          $new = @'
              Assert-Condition ($exitCode -ne 0) 'Hash-pinned SFX loader executed a mutated extracted installer.'
              $loaderOutputText = $output -join [Environment]::NewLine
              Assert-Condition ($loaderOutputText -match 'installer hash mismatch') `
                  ("SFX loader rejected the mutated installer for an unexpected reason. Child output:`n{0}" -f $loaderOutputText)
          '@
          if (-not $content.Contains($old)) {
              throw 'Expected SFX mutation assertion block was not found.'
          }
          $content = $content.Replace($old, $new)
          [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))

      - name: Remove one-time workflow and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/improve-sfx-loader-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/test-fast-patch-secure-staging.ps1
          git commit -m 'Improve FastPatch SFX loader mutation diagnostics'
          git push origin HEAD:security/fastpatch-immutable-staging
