name: Diagnose IExpress launch matrix

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Test IExpress AppLaunched path and command forms
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('iexpress-launch-matrix-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $source = Join-Path $root 'source'
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          [IO.File]::WriteAllText((Join-Path $source 'dummy.txt'), 'x', [Text.UTF8Encoding]::new($false))
          $iexpress = Join-Path $env:SystemRoot 'System32\iexpress.exe'

          function Build-IExpressProbe {
              param(
                  [Parameter(Mandatory = $true)] [string] $Name,
                  [Parameter(Mandatory = $true)] [string] $LaunchCommand
              )
              $output = Join-Path $root ($Name + '.exe')
              $sed = Join-Path $root ($Name + '.sed')
              $sourceForSed = $source.TrimEnd('\') + '\'
              $sedText = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3

          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=0
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName="$output"
          FriendlyName=$Name
          AppLaunched=$LaunchCommand
          PostInstallCmd=<None>
          AdminQuietInstCmd=$LaunchCommand
          UserQuietInstCmd=$LaunchCommand
          SourceFiles=SourceFiles

          [SourceFiles]
          SourceFiles0="$sourceForSed"

          [SourceFiles0]
          %FILE0%=

          [Strings]
          FILE0="dummy.txt"
          "@
              [IO.File]::WriteAllText($sed, $sedText, [Text.Encoding]::ASCII)
              & $iexpress /N /Q $sed
              $deadline = [DateTime]::UtcNow.AddSeconds(20)
              while ([DateTime]::UtcNow -lt $deadline -and -not (Test-Path -LiteralPath $output -PathType Leaf)) {
                  Start-Sleep -Milliseconds 100
              }
              if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
                  throw "IExpress did not build $Name."
              }
              return $output
          }

          function Run-IExpressProbe {
              param(
                  [Parameter(Mandatory = $true)] [string] $Name,
                  [Parameter(Mandatory = $true)] [string] $LaunchCommand
              )
              $probe = Join-Path $root ($Name + '.probe')
              $env:PROTONVPN_FASTPATCH_MATRIX_PROBE = $probe
              $exe = Build-IExpressProbe -Name $Name -LaunchCommand $LaunchCommand
              $process = Start-Process -FilePath $exe -PassThru
              $exited = $process.WaitForExit(7000)
              $probeExists = Test-Path -LiteralPath $probe -PathType Leaf
              $exitCode = if ($exited) { $process.ExitCode } else { $null }
              if (-not $exited) {
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
              Write-Host ("IEXPRESS_MATRIX name={0} launchLength={1} exited={2} exitCode={3} probe={4}" -f $Name, $LaunchCommand.Length, $exited, $exitCode, $probeExists)
              if ($probeExists) {
                  Write-Host ("IEXPRESS_MATRIX_VALUE name={0} value={1}" -f $Name, (Get-Content -LiteralPath $probe -Raw).Trim())
              }
              return [pscustomobject]@{ Name=$Name; Exited=$exited; Probe=$probeExists; ExitCode=$exitCode; Length=$LaunchCommand.Length }
          }

          $shortScript = '$p=$env:PROTONVPN_FASTPATCH_MATRIX_PROBE;[IO.File]::WriteAllText($p,''ok'');exit 0'
          $shortEncoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($shortScript))
          $longPadding = 'x' * 6000
          $longScript = '$x=''' + $longPadding + ''';$p=$env:PROTONVPN_FASTPATCH_MATRIX_PROBE;[IO.File]::WriteAllText($p,''ok'');exit 0'
          $longEncoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($longScript))

          $commands = [ordered]@{
              GlobalRootShort = '"\\?\GLOBALROOT\SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -EncodedCommand ' + $shortEncoded
              EnvSystemRootShort = '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -EncodedCommand ' + $shortEncoded
              LiteralWindowsShort = '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -EncodedCommand ' + $shortEncoded
              ExtendedLiteralShort = '"\\?\C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -EncodedCommand ' + $shortEncoded
              LiteralWindowsLong = '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -EncodedCommand ' + $longEncoded
          }

          $results = foreach ($entry in $commands.GetEnumerator()) {
              Run-IExpressProbe -Name $entry.Key -LaunchCommand $entry.Value
          }
          Write-Host 'IEXPRESS_MATRIX_SUMMARY'
          $results | Format-Table -AutoSize | Out-String | Write-Host

      - name: Remove launch-matrix diagnostic workflow
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/diagnose-iexpress-launch-matrix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove IExpress launch-matrix diagnostic'
          git push origin HEAD:security/fastpatch-immutable-staging
