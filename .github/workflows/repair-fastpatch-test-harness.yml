name: Repair FastPatch test harness syntax

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Repair Invoke-BootstrapFixture child capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/scripts/test-fast-patch-secure-staging.ps1'
          $content = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $pattern = '(?m)^    # Several tests intentionally make the bootstrap fail\..*return \[pscustomobject\]@\{$'
          $matches = [regex]::Matches($content, $pattern)
          if ($matches.Count -ne 1) {
              throw "Expected exactly one malformed bootstrap capture line; found $($matches.Count)."
          }
          $replacement = @'
              # Several tests intentionally make the bootstrap fail. Windows PowerShell writes an
              # unhandled child exception to stderr, which must be captured as test evidence rather
              # than promoted by this harness's ErrorActionPreference=Stop.
              $previousErrorActionPreference = $ErrorActionPreference
              try {
                  $ErrorActionPreference = 'Continue'
                  $output = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded 2>&1)
                  $exitCode = $LASTEXITCODE
              } finally {
                  $ErrorActionPreference = $previousErrorActionPreference
              }
              return [pscustomobject]@{
          '@
          $content = [regex]::Replace($content, $pattern, $replacement)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))

          $tokens = $null
          $errors = $null
          [void] [Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $errors)
          if ($errors.Count -gt 0) {
              throw "Repaired test harness still does not parse: $($errors[0].Message)"
          }

      - name: Remove one-time workflow and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/repair-fastpatch-test-harness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/test-fast-patch-secure-staging.ps1
          git commit -m 'Repair FastPatch negative-child capture harness'
          git push origin HEAD:security/fastpatch-immutable-staging
