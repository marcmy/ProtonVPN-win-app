name: Temporary FastPatch installer lifecycle applicator

on:
  push:
    branches:
      - fix/fastpatch-installer-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/fastpatch-installer-lifecycle
          persist-credentials: true

      - name: Apply lifecycle fix and regression guard
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = 'scripts/Install-ProtonVPNCompletePatch.ps1'
          $testPath = '.github/scripts/test-complete-fast-patch.ps1'

          $installer = Get-Content -LiteralPath $installerPath -Raw

          $invokeMarker = "function Invoke-BaseInstaller {"
          if (-not $installer.Contains($invokeMarker)) { throw 'Invoke-BaseInstaller marker not found.' }
          if (-not $installer.Contains('function Test-ClientRunningForTarget {')) {
            $helper = @'
          function Test-ClientRunningForTarget {
              param([Parameter(Mandatory = $true)] [string] $TargetDirectory)

              $normalizedTarget = [System.IO.Path]::GetFullPath($TargetDirectory).TrimEnd('\') + '\'
              foreach ($process in @(Get-Process -Name 'ProtonVPN.Client*' -ErrorAction SilentlyContinue)) {
                  try {
                      $processPath = $process.Path
                  } catch {
                      continue
                  }

                  if (-not [string]::IsNullOrWhiteSpace($processPath) -and
                      [System.IO.Path]::GetFullPath($processPath).StartsWith($normalizedTarget, [StringComparison]::OrdinalIgnoreCase)) {
                      return $true
                  }
              }

              return $false
          }

          '@
            $installer = $installer.Replace($invokeMarker, $helper + $invokeMarker)
          }

          $oldDelegate = "    `$process = Start-Process -FilePath 'powershell.exe' -ArgumentList (`$arguments -join ' ') -Wait -PassThru"
          $newDelegate = @'
              $process = Start-Process -FilePath 'powershell.exe' `
                  -ArgumentList ($arguments -join ' ') `
                  -NoNewWindow `
                  -Wait `
                  -PassThru
          '@.TrimEnd()
          if (-not $installer.Contains($oldDelegate)) { throw 'Base-installer delegation line not found.' }
          $installer = $installer.Replace($oldDelegate, $newDelegate)

          $stateMarker = @'
          $rootLauncherPersisted = $false
          $exitCode = 1
          '@.Trim()
          $stateReplacement = @'
          $rootLauncherPersisted = $false
          $clientWasRunningBeforeInstall = $false
          $exitCode = 1
          '@.Trim()
          if (-not $installer.Contains($stateMarker)) { throw 'Installer state marker not found.' }
          $installer = $installer.Replace($stateMarker, $stateReplacement)

          $targetMarker = '        $targetDirectory = Resolve-TargetDirectory'
          $targetReplacement = @'
                  $targetDirectory = Resolve-TargetDirectory
                  $clientWasRunningBeforeInstall = Test-ClientRunningForTarget -TargetDirectory $targetDirectory
          '@.TrimEnd()
          if (-not $installer.Contains($targetMarker)) { throw 'Target-directory marker not found.' }
          $installer = $installer.Replace($targetMarker, $targetReplacement)

          $successMarker = "        Write-Host 'Complete Proton VPN FastPatch installed successfully.' -ForegroundColor Green"
          $successReplacement = @'
                  if (-not $NoRestart -and $RestartClient -and $clientWasRunningBeforeInstall -and
                      -not (Test-ClientRunningForTarget -TargetDirectory $targetDirectory)) {
                      $clientExecutable = Join-Path $targetDirectory 'ProtonVPN.Client.exe'
                      if (Test-Path -LiteralPath $clientExecutable -PathType Leaf) {
                          try {
                              Write-Host 'Base installer did not leave the previously running Proton VPN Client active; restarting it now.' -ForegroundColor Yellow
                              Start-Process -FilePath $clientExecutable | Out-Null
                          } catch {
                              Write-Warning "Could not restart Proton VPN Client after complete patch installation: $($_.Exception.Message)"
                          }
                      }
                  }

                  Write-Host 'Complete Proton VPN FastPatch installed successfully.' -ForegroundColor Green
          '@.TrimEnd()
          if (-not $installer.Contains($successMarker)) { throw 'Complete installer success marker not found.' }
          $installer = $installer.Replace($successMarker, $successReplacement)

          [IO.File]::WriteAllText($installerPath, $installer, [Text.UTF8Encoding]::new($false))

          $tests = Get-Content -LiteralPath $testPath -Raw
          if (-not $tests.Contains('function Test-InstallerLifecycleContracts {')) {
            $testFunction = @'
          function Test-InstallerLifecycleContracts {
              $content = Get-Content -LiteralPath $completeInstallerScript -Raw

              Assert-Condition ($content.Contains('-NoNewWindow')) `
                  'Complete FastPatch base-installer delegation must reuse the existing console.'
              Assert-Condition ($content.Contains('$clientWasRunningBeforeInstall = Test-ClientRunningForTarget -TargetDirectory $targetDirectory')) `
                  'Complete FastPatch must capture client state before delegating the version-folder install.'
              Assert-Condition ($content.Contains('-not (Test-ClientRunningForTarget -TargetDirectory $targetDirectory)')) `
                  'Complete FastPatch must avoid duplicate client restart when the base installer already restarted it.'
              Assert-Condition ($content.Contains("Base installer did not leave the previously running Proton VPN Client active; restarting it now.")) `
                  'Complete FastPatch is missing its client restart fallback.'
          }

          '@
            $runMarker = 'New-Item -ItemType Directory -Force -Path $testRoot | Out-Null'
            if (-not $tests.Contains($runMarker)) { throw 'Regression run marker not found.' }
            $tests = $tests.Replace($runMarker, $testFunction + $runMarker)
            $tests = $tests.Replace('    $runtimeFixture = Test-RuntimeDependencyClosure', "    Test-InstallerLifecycleContracts`n    `$runtimeFixture = Test-RuntimeDependencyClosure")
          }
          [IO.File]::WriteAllText($testPath, $tests, [Text.UTF8Encoding]::new($false))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $installerPath $testPath
          if (git diff --cached --quiet) { throw 'Lifecycle applicator produced no changes.' }
          git commit -m 'Fix FastPatch installer process lifecycle'
          git push origin HEAD:fix/fastpatch-installer-lifecycle
