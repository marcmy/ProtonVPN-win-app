name: Diagnose FastPatch IExpress standalone

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Build and run standalone IExpress probe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('fastpatch-sfx-diag-' + [Guid]::NewGuid().ToString('N'))
          $patch = Join-Path $root 'patch'
          $output = Join-Path $root 'ProtonVPN-Test-Patch.exe'
          $installer = Join-Path $root 'Install-ProtonVPNPatch.ps1'
          $launcher = Join-Path $root 'Install-ProtonVPNPatch.cmd'
          $probe = Join-Path $root 'probe.json'
          New-Item -ItemType Directory -Force -Path $patch | Out-Null
          [IO.File]::WriteAllText((Join-Path $patch 'ProtonVPN.Client.dll'), 'sfx-payload', [Text.UTF8Encoding]::new($false))
          $payloadFile = Get-Item -LiteralPath (Join-Path $patch 'ProtonVPN.Client.dll')
          $manifest = [ordered]@{
              schemaVersion = 1
              targetVersion = '5.1.5'
              buildMode = 'client'
              sourceCommit = 'sfx-standalone-diag'
              files = @([ordered]@{
                  path = 'ProtonVPN.Client.dll'
                  size = $payloadFile.Length
                  sha256 = (Get-FileHash -LiteralPath $payloadFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              })
          }
          [IO.File]::WriteAllText((Join-Path $patch 'patch-manifest.json'), ($manifest | ConvertTo-Json -Depth 6), [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($launcher, '@echo off', [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($installer, @'
          [CmdletBinding(SupportsShouldProcess = $true)]
          param(
              [string] $PatchPath,
              [string] $TargetVersion,
              [switch] $RestartClient,
              [switch] $PauseBeforeExit,
              [switch] $ValidateOnly,
              [string] $ExpectedPatchArchiveSha256 = ''
          )
          function Dummy-ElevationWait {
              $process = Start-Process -FilePath 'cmd.exe' `
                  -ArgumentList '/c exit 0' `
                  -Wait `
                  -PassThru
              return $process.ExitCode
          }
          if ($ValidateOnly) { exit 0 }
          $result = [ordered]@{
              Is64BitProcess = [Environment]::Is64BitProcess
              PSCommandPath = [string] $PSCommandPath
              DefinitionContainsProbe = ([string] $MyInvocation.MyCommand.Definition).Contains('DefinitionContainsProbe')
              PatchPath = [IO.Path]::GetFullPath($PatchPath)
              ExpectedPatchArchiveSha256 = $ExpectedPatchArchiveSha256
              ActualPatchArchiveSha256 = (Get-FileHash -LiteralPath $PatchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $result | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $env:PROTONVPN_FASTPATCH_SFX_PROBE -Encoding UTF8
          exit 0
          '@, [Text.UTF8Encoding]::new($false))

          & .\scripts\New-ProtonVPNPatchSfx.ps1 -PatchPath $patch -OutputPath $output -InstallerScriptPath $installer -LauncherPath $launcher
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'Diagnostic SFX was not built.' }

          $env:PROTONVPN_FASTPATCH_SFX_PROBE = $probe
          $process = Start-Process -FilePath $output -PassThru
          if (-not $process.WaitForExit(20000)) {
              $probeExists = Test-Path -LiteralPath $probe -PathType Leaf
              Write-Host "SFX_DIAG timeout pid=$($process.Id) probeExists=$probeExists"
              if ($probeExists) {
                  Write-Host 'SFX_DIAG probe:'
                  Get-Content -LiteralPath $probe -Raw | Write-Host
              }
              Write-Host 'SFX_DIAG processes:'
              Get-CimInstance Win32_Process |
                  Where-Object {
                      $_.ProcessId -eq $process.Id -or
                      $_.ParentProcessId -eq $process.Id -or
                      $_.Name -match '^(powershell|cmd|conhost|wextract)\.exe$'
                  } |
                  Sort-Object ProcessId |
                  Select-Object ProcessId, ParentProcessId, Name, CommandLine |
                  Format-List | Out-String | Write-Host
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Standalone IExpress diagnostic timed out.'
          }

          Write-Host "SFX_DIAG exited code=$($process.ExitCode) probeExists=$(Test-Path -LiteralPath $probe -PathType Leaf)"
          if (Test-Path -LiteralPath $probe -PathType Leaf) {
              Get-Content -LiteralPath $probe -Raw | Write-Host
          }
          if ($process.ExitCode -ne 0) { throw "Standalone IExpress diagnostic exited $($process.ExitCode)." }

      - name: Remove standalone diagnostic workflow
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/diagnose-fastpatch-sfx-standalone.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove standalone FastPatch IExpress diagnostic'
          git push origin HEAD:security/fastpatch-immutable-staging
