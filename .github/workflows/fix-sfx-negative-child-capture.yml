name: Fix SFX negative child capture

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Capture expected SFX loader failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/scripts/test-fast-patch-secure-staging.ps1'
          $content = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")

          $functionStart = $content.IndexOf('function Test-SfxLoaderRejectsMutatedInstaller {', [StringComparison]::Ordinal)
          $functionEnd = $content.IndexOf('function Test-IExpressVerifiedInMemoryEntry {', $functionStart, [StringComparison]::Ordinal)
          if ($functionStart -lt 0 -or $functionEnd -le $functionStart) {
              throw 'Could not isolate Test-SfxLoaderRejectsMutatedInstaller.'
          }

          $prefix = $content.Substring(0, $functionStart)
          $functionText = $content.Substring($functionStart, $functionEnd - $functionStart)
          $suffix = $content.Substring($functionEnd)
          $pattern = '(?ms)^(?<indent>[ \t]*)Push-Location \$fixtureRoot\s*\n\k<indent>try \{\s*\n\k<indent>[ \t]+\$output = @\(& powershell\.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand \$encoded 2>&1\)\s*\n\k<indent>[ \t]+\$exitCode = \$LASTEXITCODE\s*\n\k<indent>\} finally \{\s*\n\k<indent>[ \t]+Pop-Location\s*\n\k<indent>\}'
          $match = [regex]::Match($functionText, $pattern)
          if (-not $match.Success) {
              throw 'Expected SFX mutation child invocation block was not found inside its test function.'
          }
          $indent = $match.Groups['indent'].Value
          $replacement = @(
              $indent + 'Push-Location $fixtureRoot',
              $indent + '$previousErrorActionPreference = $ErrorActionPreference',
              $indent + 'try {',
              $indent + '    # This child is expected to fail on the build-time installer hash. Capture',
              $indent + "    # Windows PowerShell's stderr as assertion evidence instead of promoting the",
              $indent + "    # NativeCommandError through this harness's ErrorActionPreference=Stop.",
              $indent + "    `$ErrorActionPreference = 'Continue'",
              $indent + '    $output = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded 2>&1)',
              $indent + '    $exitCode = $LASTEXITCODE',
              $indent + '} finally {',
              $indent + '    $ErrorActionPreference = $previousErrorActionPreference',
              $indent + '    Pop-Location',
              $indent + '}'
          ) -join "`n"

          $functionText = $functionText.Substring(0, $match.Index) + $replacement + $functionText.Substring($match.Index + $match.Length)
          $content = $prefix + $functionText + $suffix
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))

          $tokens = $null
          $errors = $null
          [void] [Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $errors)
          if ($errors.Count -gt 0) {
              throw "Updated secure-staging regression does not parse: $($errors[0].Message)"
          }

      - name: Remove one-time workflow and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-sfx-negative-child-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/test-fast-patch-secure-staging.ps1
          git commit -m 'Capture expected SFX loader mutation failure'
          git push origin HEAD:security/fastpatch-immutable-staging
