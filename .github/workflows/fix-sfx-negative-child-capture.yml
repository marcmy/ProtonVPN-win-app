name: Fix SFX negative child capture

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Capture expected SFX loader failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/scripts/test-fast-patch-secure-staging.ps1'
          $content = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $old = @'
              Push-Location $fixtureRoot
              try {
                  $output = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded 2>&1)
                  $exitCode = $LASTEXITCODE
              } finally {
                  Pop-Location
              }
          '@
          $new = @'
              Push-Location $fixtureRoot
              $previousErrorActionPreference = $ErrorActionPreference
              try {
                  # This child is expected to fail on the build-time installer hash. Capture
                  # Windows PowerShell's stderr as assertion evidence instead of promoting the
                  # NativeCommandError through this harness's ErrorActionPreference=Stop.
                  $ErrorActionPreference = 'Continue'
                  $output = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded 2>&1)
                  $exitCode = $LASTEXITCODE
              } finally {
                  $ErrorActionPreference = $previousErrorActionPreference
                  Pop-Location
              }
          '@
          if (-not $content.Contains($old)) {
              throw 'Expected SFX mutation child invocation block was not found.'
          }
          $content = $content.Replace($old, $new)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))

          $tokens = $null
          $errors = $null
          [void] [Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $errors)
          if ($errors.Count -gt 0) {
              throw "Updated secure-staging regression does not parse: $($errors[0].Message)"
          }

      - name: Remove one-time workflow and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-sfx-negative-child-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/test-fast-patch-secure-staging.ps1
          git commit -m 'Capture expected SFX loader mutation failure'
          git push origin HEAD:security/fastpatch-immutable-staging
