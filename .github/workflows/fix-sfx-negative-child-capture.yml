name: Fix SFX negative child capture

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true

      - name: Capture expected SFX loader failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github/scripts/test-fast-patch-secure-staging.ps1'
          [string[]] $lines = Get-Content -LiteralPath $path

          $functionStart = [Array]::IndexOf($lines, 'function Test-SfxLoaderRejectsMutatedInstaller {')
          $functionEnd = [Array]::IndexOf($lines, 'function Test-IExpressVerifiedInMemoryEntry {')
          if ($functionStart -lt 0 -or $functionEnd -le $functionStart) {
              throw 'Could not isolate Test-SfxLoaderRejectsMutatedInstaller.'
          }

          $pushIndex = -1
          for ($i = $functionStart; $i -lt $functionEnd; $i++) {
              if ($lines[$i].Trim() -eq 'Push-Location $fixtureRoot') {
                  if ($pushIndex -ge 0) { throw 'Multiple Push-Location blocks found in SFX mutation test.' }
                  $pushIndex = $i
              }
          }
          if ($pushIndex -lt 0) { throw 'SFX mutation Push-Location block was not found.' }

          $expected = @(
              'Push-Location $fixtureRoot',
              'try {',
              '$output = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded 2>&1)',
              '$exitCode = $LASTEXITCODE',
              '} finally {',
              'Pop-Location',
              '}'
          )
          for ($offset = 0; $offset -lt $expected.Count; $offset++) {
              if ($lines[$pushIndex + $offset].Trim() -ne $expected[$offset]) {
                  throw "Unexpected SFX mutation child block at offset $offset : $($lines[$pushIndex + $offset])"
              }
          }

          $indent = $lines[$pushIndex].Substring(0, $lines[$pushIndex].IndexOf('P'))
          $replacement = @(
              $indent + 'Push-Location $fixtureRoot',
              $indent + '$previousErrorActionPreference = $ErrorActionPreference',
              $indent + 'try {',
              $indent + '    # This child is expected to fail on the build-time installer hash. Capture',
              $indent + "    # Windows PowerShell's stderr as assertion evidence instead of promoting the",
              $indent + "    # NativeCommandError through this harness's ErrorActionPreference=Stop.",
              $indent + "    `$ErrorActionPreference = 'Continue'",
              $indent + '    $output = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded 2>&1)',
              $indent + '    $exitCode = $LASTEXITCODE',
              $indent + '} finally {',
              $indent + '    $ErrorActionPreference = $previousErrorActionPreference',
              $indent + '    Pop-Location',
              $indent + '}'
          )

          $before = if ($pushIndex -gt 0) { @($lines[0..($pushIndex - 1)]) } else { @() }
          $afterStart = $pushIndex + $expected.Count
          $after = if ($afterStart -lt $lines.Count) { @($lines[$afterStart..($lines.Count - 1)]) } else { @() }
          $updated = @($before) + @($replacement) + @($after)
          [IO.File]::WriteAllLines($path, $updated, [Text.UTF8Encoding]::new($false))

          $tokens = $null
          $errors = $null
          [void] [Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $errors)
          if ($errors.Count -gt 0) {
              throw "Updated secure-staging regression does not parse: $($errors[0].Message)"
          }

      - name: Remove one-time workflow and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/workflows/fix-sfx-negative-child-capture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/test-fast-patch-secure-staging.ps1
          git commit -m 'Capture expected SFX loader mutation failure'
          git push origin HEAD:security/fastpatch-immutable-staging
