name: Apply FastPatch SFX trust hardening

on:
  push:
    branches:
      - security/fastpatch-immutable-staging
    paths:
      - .github/scripts/transform-fastpatch-sfx-trust.py
      - .github/workflows/apply-fastpatch-sfx-trust.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: security/fastpatch-immutable-staging

      - name: Tighten the one-time transform to script scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/transform-fastpatch-sfx-trust.py')
          s = p.read_text()
          s = s.replace('return text.replace(old, new)', 'return text.replace(old, new, 1)', 1)
          marker = '        f"{path}: invocation script capture")'
          if marker not in s:
              raise SystemExit('invocation-script transform marker missing')
          s = s.replace(marker, '        f"{path}: invocation script capture", count=2)', 1)
          p.write_text(s)
          PY

      - name: Apply SFX trust-boundary transformation
        run: python .github/scripts/transform-fastpatch-sfx-trust.py

      - name: Remove one-time transformation machinery
        run: |
          rm .github/scripts/transform-fastpatch-sfx-trust.py
          rm .github/workflows/apply-fastpatch-sfx-trust.yml

      - name: Commit transformed sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Close FastPatch IExpress trust boundary"
          git push origin HEAD:security/fastpatch-immutable-staging
