name: Adapt FastPatch compiled SFX tests

on:
  push:
    branches:
      - security/fastpatch-immutable-staging

permissions:
  contents: write

jobs:
  adapt:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fastpatch-immutable-staging
          persist-credentials: true
      - name: Migrate secure-staging regression to compiled SFX
        shell: pwsh
        run: python .github/scripts/_temp_fastpatch_adapt_compiled_test.py
      - name: Parse and run secure-staging regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/Install-ProtonVPNPatch.ps1',
            'scripts/Install-ProtonVPNCompletePatch.ps1',
            'scripts/New-ProtonVPNPatchSfx.ps1',
            '.github/scripts/test-fast-patch-secure-staging.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$path : $($errors[0].Message)" }
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/scripts/test-fast-patch-secure-staging.ps1
          if ($LASTEXITCODE -ne 0) { throw "Secure-staging regression failed with exit code $LASTEXITCODE." }
      - name: Commit permanent regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --force .github/scripts/_temp_fastpatch_adapt_compiled_test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/test-fast-patch-secure-staging.ps1
          git commit -m 'Test immutable compiled FastPatch SFX boundary'
          git push origin HEAD:security/fastpatch-immutable-staging
