vulnerabilities:
  - id: CVE-2026-40021
    paths:
      - "Directory.Packages.props"
    purls:
      - "pkg:nuget/log4net@3.2.0"
    expired_at: 2026-10-31
    statement: >-
      Proton VPN 5.1.5 installs the strongly named log4net 3.2.0.0 assembly.
      The current logger is configured programmatically with PatternLayout rather than
      the affected XmlLayout or XmlLayoutSchemaLog4J paths. Fast-patch artifacts must
      remain binary-compatible with the installed app. Reassess when the official
      Proton VPN package upgrades log4net or the patch packaging model changes.
